<title>Proof of Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one sticky header (screens + industry scenarios), then four screens that all redraw from the chosen industry.
   Forest green + electric lime, cream cards, chunky grotesk with italic serif accents, bento tiles, sticker seal. */
:root{
  --page:#F4F2EA; --surface:#FFFFFF; --sunk:#ECEADF; --line:#E0DDD0; --line-2:#CDC9B8;
  --ink:#0C2418; --muted:#4D5E54; --faint:#7F8A82;
  --forest:#0A2B1C; --forest-2:#11392A; --forest-3:#1A4A35; --on-forest:#F1F5EC; --on-forest-2:#A8BFAF;
  --lime:#D6F53F; --lime-ink:#0A2B1C; --lime-soft:#F0FAC6;
  --green:#4FC864; --green-soft:#DCF3E0; --seal:#1B8F45;
  --warn:#C2410C; --warn-soft:#FCEBDD; --del:#FBE4E0; --add:#E0F4E4; --me:#0A2B1C;
  --shadow:0 1px 2px rgba(10,43,28,.06),0 18px 50px rgba(10,43,28,.14);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-serif:"Instrument Serif",ui-serif,Georgia,serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#06150E; --surface:#0E2419; --sunk:#0A1C13; --line:#1D3828; --line-2:#2A4A37;
  --ink:#EAF2E6; --muted:#A3B8A9; --faint:#7A9183;
  --forest:#0C3121; --forest-2:#123E2B; --forest-3:#1B4D37;
  --lime-soft:#25300A; --green-soft:#0F3320; --seal:#5BD978; --warn:#F2A36B; --warn-soft:#2E1C10; --del:#3A1712; --add:#0F3320; --me:#1F6B45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#06150E; --surface:#0E2419; --sunk:#0A1C13; --line:#1D3828; --line-2:#2A4A37;
  --ink:#EAF2E6; --muted:#A3B8A9; --faint:#7A9183;
  --forest:#0C3121; --forest-2:#123E2B; --forest-3:#1B4D37;
  --lime-soft:#25300A; --green-soft:#0F3320; --seal:#5BD978; --warn:#F2A36B; --warn-soft:#2E1C10; --del:#3A1712; --add:#0F3320; --me:#1F6B45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--forest)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;margin:0;text-wrap:balance}
em.it{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dark{background:var(--forest);color:var(--on-forest)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid var(--line-2);background:var(--surface);white-space:nowrap;transition:transform .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.forest{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.btn.ghost-d{background:transparent;color:var(--on-forest);border-color:rgba(241,245,236,.35)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn .arr{width:24px;height:24px;border-radius:50%;background:var(--forest);color:var(--lime);display:grid;place-items:center;margin-right:-10px}
.btn.forest .arr{background:var(--lime);color:var(--forest)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--seal)}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.dk{background:rgba(214,245,63,.14);color:var(--lime)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--seal)}
.dark .eyebrow{color:var(--lime)}
.spark{fill:var(--lime);stroke:var(--forest);stroke-width:1.4}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.04em;white-space:nowrap;flex:none}
.logo .lm{width:24px;height:24px;border-radius:8px;background:var(--lime);display:grid;place-items:center}
.logo .lm svg{width:15px;height:15px;stroke:var(--forest);stroke-width:3}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px;font-family:var(--f-display)}

/* ---------- Header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--forest);color:var(--on-forest);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr .r1{display:flex;align-items:center;gap:12px;height:58px}
.screens{display:flex;gap:2px;margin-left:auto;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none}
.screens button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--on-forest-2);white-space:nowrap}
.screens button[aria-current="page"]{background:var(--lime);color:var(--lime-ink)}
.theme{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--on-forest-2);flex:none;border:1px solid rgba(255,255,255,.15)}
.theme:hover{color:var(--lime)}
.r2{display:flex;align-items:center;gap:8px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.r2 .lbl{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--on-forest-2);white-space:nowrap;margin-right:4px}
.r2 button{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.16);font-size:13.5px;font-weight:500;color:var(--on-forest);white-space:nowrap}
.r2 button i{width:8px;height:8px;border-radius:50%;background:var(--on-forest-2)}
.r2 button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.r2 button[aria-pressed="true"] i{background:var(--lime)}
.view{display:none}.view.on{display:block}

.sealsvg{display:block;filter:drop-shadow(4px 4px 0 var(--forest))}
.spin{animation:rot 36s linear infinite;transform-origin:60px 60px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}

.sk{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;font-size:13.5px}
.sk .b{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.sk .b i{display:block;height:100%;border-radius:8px;background:var(--forest)}
:root[data-theme="dark"] .sk .b i{background:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sk .b i{background:var(--green)}}
.sk b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Landing ---------- */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(60% 55% at 50% 75%,rgba(79,200,100,.38),transparent 70%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/72px 72px,
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/72px 72px,
  var(--forest);color:var(--on-forest)}
.h-copy{text-align:center;padding-block:64px 0;max-width:900px;margin:0 auto}
.h-copy h1{font-size:clamp(44px,7.4vw,94px);line-height:.98;letter-spacing:-.045em;margin:20px 0 22px}
.h-copy h1 em.it{color:var(--lime);font-size:1.08em}
.h-copy p{font-size:19px;color:var(--on-forest-2);max-width:600px;margin:0 auto 30px}
.ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stage{position:relative;height:430px;max-width:980px;margin:64px auto 0}
.window{position:absolute;left:50%;transform:translateX(-50%);top:0;width:min(560px,92%);height:500px;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:20px;box-shadow:0 -20px 80px rgba(0,0,0,.35);border:6px solid var(--forest-3);border-bottom:0}
.window .wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.window .wh b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px}
.wrow + .wrow{margin-top:4px}
.wrow.top{background:var(--lime-soft)}
.wrow .av{width:36px;height:36px;font-size:13px}
.wrow .nm{flex:1;min-width:0}
.wrow .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .nm small{color:var(--faint);font-size:12.5px}
.wrow .sc{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.03em}
.float{position:absolute;background:var(--surface);color:var(--ink);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);z-index:2}
.f-proof{left:0;top:70px;width:250px;transform:rotate(-4deg)}
.f-proof .hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.f-proof .hd .av{width:34px;height:34px;font-size:12px}
.f-proof .hd b{font-size:14px;display:block;line-height:1.2}
.f-proof .hd small{font-size:12px;color:var(--faint)}
.f-proof .sk{grid-template-columns:72px 1fr 22px;font-size:12px}
.f-stat{right:20px;top:40px;width:200px;transform:rotate(3deg)}
.f-stat span{font-size:12.5px;color:var(--faint)}
.f-stat b{display:block;font-family:var(--f-display);font-size:34px;letter-spacing:-.04em;line-height:1.1}
.f-chat{right:-10px;top:200px;width:260px;transform:rotate(-2deg);padding:12px 14px}
.f-chat .who{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between}
.f-chat .bub{background:var(--sunk);border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:13px;margin:6px 0}
.f-chat .bub.me{background:var(--forest);color:var(--on-forest);border-radius:14px 14px 4px 14px;margin-left:26px}
.f-avs{left:-10px;top:360px;display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 16px 8px 8px;transform:rotate(2deg)}
.f-avs .stack{display:flex}
.f-avs .stack .av{width:30px;height:30px;font-size:11px;border:2px solid var(--surface);margin-left:-8px}
.f-avs .stack .av:first-child{margin-left:0}
.f-avs b{font-size:13.5px}
.f-seal{position:absolute;left:calc(50% + 230px);top:-78px;z-index:3}
.h-spark{position:absolute;z-index:1}

.sec{padding-block:96px}
.sec h2{font-size:clamp(34px,5vw,60px);line-height:1;letter-spacing:-.045em;margin:14px 0 16px;max-width:780px}
.sec h2 em.it{font-size:1.08em}
.sec p.lede{color:var(--muted);font-size:18px;max-width:600px;margin:0 0 44px}
.dark.sec p.lede{color:var(--on-forest-2)}
.center{text-align:center}.center h2,.center p.lede{margin-left:auto;margin-right:auto}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:left}
.step{padding:28px;border-radius:28px;min-height:290px;display:flex;flex-direction:column}
.step .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.step h3{font-size:26px;margin:22px 0 8px}
.step p{margin:0;font-size:15px;opacity:.85}
.step .mini{margin-top:auto;padding-top:20px}
.step.s1{background:var(--forest);color:var(--on-forest)} .step.s1 .n{background:var(--lime);color:var(--forest)}
.step.s2{background:var(--lime);color:var(--lime-ink)} .step.s2 .n{background:var(--forest);color:var(--lime)}
.step.s3{background:var(--green);color:var(--forest)} .step.s3 .n{background:var(--surface);color:var(--forest)}
.chipbox{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.step.s2 .chipbox,.step.s3 .chipbox{background:rgba(10,43,28,.1)}

.trust{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.tlist2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ti{background:var(--forest-2);border-radius:22px;padding:22px}
.ti .ic{width:42px;height:42px;border-radius:14px;background:var(--lime);color:var(--forest);display:grid;place-items:center;margin-bottom:16px}
.ti b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
.ti span{color:var(--on-forest-2);font-size:14.5px}
.cmp{background:var(--surface);color:var(--ink);border-radius:28px;padding:28px;min-width:0}
.cmp h3{font-size:22px;margin-bottom:12px}
.cmp table{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th{text-align:left;font-weight:600;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
.cmp td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td:first-child{font-weight:600;width:28%;padding-right:10px}
.cmp .x{color:var(--faint);text-decoration:line-through;padding-right:12px}

.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(180px,auto);gap:14px}
.tile{border-radius:28px;padding:24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;text-align:left}
button.tile{transition:transform .15s}
button.tile:hover{transform:translateY(-3px)}
.tile.big{grid-column:span 2;grid-row:span 2;background:var(--lime);color:var(--lime-ink);justify-content:flex-end}
.tile.big h3{font-size:clamp(38px,5vw,62px);line-height:.92;text-transform:uppercase;letter-spacing:-.04em;font-weight:800}
.tile.fo{background:var(--forest);color:var(--on-forest)}
.tile.gr{background:var(--green);color:var(--forest)}
.tile.wh{background:var(--surface);border:1px solid var(--line)}
.tile.li{background:var(--lime-soft);border:1px solid var(--line)}
.tile.wide{grid-column:span 2}
.tile .tt{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.03em;line-height:1.1;padding-right:56px}
.tile .ts{font-size:14px;opacity:.82}
.tile .go{margin-top:auto;padding-top:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.tile .badge{position:absolute;top:20px;right:20px}
.tile .num{font-family:var(--f-display);font-weight:800;font-size:54px;letter-spacing:-.05em;line-height:1}
.tile .big-spark{position:absolute;right:-20px;top:-20px;width:160px;height:160px}
.tile.big .spark,.cta .spark,.ai-note .spark{fill:var(--forest);stroke:none}
.cta{background:var(--lime);color:var(--lime-ink);border-radius:36px;padding:64px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;margin:0 auto 96px;position:relative;overflow:hidden}
.cta h2{font-size:clamp(34px,4.8vw,60px);line-height:1;letter-spacing:-.045em;margin:0;max-width:700px}
.cta .cs{position:absolute;width:90px;height:90px;right:30%;top:-30px}
.foot{background:var(--forest);color:var(--on-forest-2);padding-block:44px}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:14px}
.foot .logo{color:var(--on-forest)}

/* ---------- Challenge ---------- */
.ch-bar{background:var(--forest-2);color:var(--on-forest)}
.ch-bar .wrap{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.co{display:flex;align-items:center;gap:12px;min-width:0}
.co-logo{width:40px;height:40px;border-radius:12px;background:var(--lime);color:var(--forest);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.ch-bar b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;line-height:1.2}
.ch-bar small{color:var(--on-forest-2);font-size:13px}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:15px;padding:8px 16px;border-radius:999px;background:var(--lime);color:var(--forest);font-weight:500;font-variant-numeric:tabular-nums}
.timer i{width:8px;height:8px;border-radius:50%;background:var(--forest);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ch{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding-block:28px 64px}
.ch > *{min-width:0}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;padding:14px;border-radius:18px;text-align:left;border:1.5px solid transparent}
.task:hover{background:var(--surface)}
.task[aria-current="step"]{background:var(--surface);border-color:var(--forest)}
.task .tn{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.task.done .tn{background:var(--green);color:var(--forest)}
.task[aria-current="step"] .tn{background:var(--forest);color:var(--lime)}
.task b{display:block;font-size:15px;line-height:1.3}
.task small{color:var(--faint);font-size:12.5px}
.ai-note{margin-top:14px;padding:18px 44px 18px 18px;border-radius:22px;background:var(--lime);color:var(--lime-ink);font-size:14px;position:relative}
.ai-note b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
.ai-note svg.s{position:absolute;right:14px;top:16px;width:24px;height:24px}
.panel{display:none}.panel.on{display:block}
.panel h2{font-size:38px;letter-spacing:-.04em;margin:0 0 6px}
.panel > p{color:var(--muted);margin:0 0 20px;max-width:68ch}
.work{padding:22px;display:flex;flex-direction:column;gap:16px}
.queue{display:flex;gap:8px;flex-wrap:wrap}
.queue span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:var(--sunk);font-size:13.5px;font-weight:500;color:var(--muted)}
.queue span.now{background:var(--lime-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--forest)}
.queue span.done{color:var(--seal)}
.msg{background:var(--sunk);border-radius:18px;padding:16px 18px;font-size:15px}
.msg header{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-bottom:6px;gap:8px;flex-wrap:wrap}
.msg header b{color:var(--ink)}
.blk{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
.blk table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.blk th{text-align:left;font-weight:600;font-size:12.5px;color:var(--faint);padding:10px 14px;background:var(--sunk)}
.blk td{padding:10px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.blk tr.hl td{background:var(--lime-soft);font-weight:600}
.blk .note{padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.diff{font-family:var(--f-mono);font-size:13px;line-height:1.7;min-width:520px}
.diff .ln{display:block;padding:0 14px;white-space:pre}

.psec{margin-top:18px;padding:28px}
.samples{display:flex;flex-direction:column;gap:12px}
.sample{display:grid;grid-template-columns:170px 1fr;gap:20px;background:var(--sunk);border-radius:20px;padding:18px 20px}

.share h3{font-size:24px;margin-bottom:6px}
.share p{margin:0 0 16px;color:var(--muted)}
.share .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.li-entry{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}

.urlbox{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.urlbox code{font-family:var(--f-mono);font-size:12px;word-break:break-all;flex:1;min-width:0;color:var(--muted)}
.urlbox button{font-size:13px;font-weight:600;color:var(--seal);white-space:nowrap}
.verify{display:flex;align-items:center;gap:16px;padding:20px 22px;margin-top:18px;flex-wrap:wrap;background:var(--forest);color:var(--on-forest);border:0}
.verify .ok{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--forest);display:grid;place-items:center;flex:none}
.verify .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.owner{margin-top:14px;font-size:13.5px;color:var(--faint);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--forest);color:var(--on-forest);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center;border:1.5px solid var(--lime)}

@media (max-width:1000px){

  .funnel{grid-template-columns:repeat(2,1fr)}

  .cand .rk{display:none}
  .cand .minibars{grid-column:1;height:22px}

  .cert-meta{grid-template-columns:1fr 1fr}

}

function blockHTML(b){
  if(!b) return '';
  if(b.type==='table'){
    const cell=c=>{ if(typeof c==='string') return `<td>${esc(c)}</td>`; return `<td>${c.p?`<span class="pill ${c.p}">${esc(c.t)}</span>`:esc(c.t)}</td>`; };
    return `<div class="blk"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr class="${r.some(c=>c&&c.hl)?'hl':''}">${r.map(cell).join('')}</tr>`).join('')}</tbody></table>${b.note?`<div class="note">${esc(b.note)}</div>`:''}</div>`;
  }
  return `<div class="blk"><div class="diff"><div class="fh">${esc(b.file)}</div>${b.lines.map(([m,t])=>`<span class="ln ${m==='-'?'d':m==='+'?'a':''}">${m} ${esc(t)}</span>`).join('')}</div></div>`;
}

function wc(){const a=$('#answer'); if(a) $('#wc').textContent=a.value.trim().split(/\s+/).filter(Boolean).length+' words';}

function sendChat(v){

    const bar=$('#meterBar'); bar.style.width=v2+'%'; bar.style.background=meterColor(v2);

          <h3>Show it where recruiters look</h3>
          <p>One click adds this to the Licenses &amp; certifications section of a LinkedIn profile, with a link back to this page so anyone can check it.</p>
          <div class="acts"><button class="btn sm lime" id="liAdd">Add to LinkedIn</button><button class="btn sm" id="liPost">Share a post</button><button class="btn sm" id="dlBadge">Download badge</button></div>
          <div class="li-entry"><div class="lg">${svg('i-check')}</div><div><b>${esc(d.badge)} – ${d.level}</b><small>Proof of Work</small><small>Issued Nov 2026 · Expires Nov 2028</small><small>Credential ID POW-${d.id}</small><span class="sc">Show credential</span></div></div>
          <div class="urlbox" id="urlbox" hidden><code id="liUrl"></code><button id="copyLi">Copy</button></div>
        </div>
      </div>
    </div>

    <div class="card verify">
      <div class="ok">${svg('i-check')}</div>
      <div><b>This proof is genuine.</b><div style="font-size:14px;color:var(--on-forest-2)">Anyone can check it at <span class="mono" style="color:var(--lime)">proofofwork.app/p/${d.id}</span></div></div>
      <div class="r"><button class="btn sm lime" id="copyProof">Copy link</button></div>
    </div>
    <p class="owner">${esc(fn)} chose to make this proof public and can hide it at any time.</p>
  </div></div>`;
}
function showLi(){
  const u=liUrl(D()); $('#liUrl').textContent=u; $('#urlbox').hidden=false;
  toast('In the live app this opens LinkedIn with the form filled in. Here we show the link instead.');
}
async function copy(text,msg){ try{ await navigator.clipboard.writeText(text); toast(msg); }catch(e){ toast('Copy didn’t work here. Select the text and copy it instead.'); } }

/* ======================================================================
   Routing and events
   ====================================================================== */
function renderAll(){ renderHeader(); renderLanding(); renderChallenge(); renderEmployer(); renderProof(); }
function show(view,{scroll=true}={}){
  S.view=view; $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view)); renderHeader();
  const h=`${S.ind}-${view}`; if(location.hash.slice(1)!==h){ try{ history.replaceState(null,'','#'+h); }catch(e){ location.hash=h; } }
  if(scroll) window.scrollTo(0,0);
}
function setInd(k){ if(!IND[k]) return; S.ind=k; S.sel=0; S.filt='all'; S.task=1; S.jt=0; S.done={}; S.finished=false; S.secs=38*60+12; renderAll(); show(S.view); }
function fromHash(){
  const [k,v]=location.hash.slice(1).split('-');
  if(IND[k] && k!==S.ind){ S.ind=k; S.sel=0; S.task=1; S.jt=0; S.done={}; S.finished=false; renderAll(); }
  show(VIEWS.includes(v)?v:S.view,{scroll:false});
}

$('#screens').addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b) show(b.dataset.v);});
$('#inds').addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(b) setInd(b.dataset.i);});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); show(g.dataset.go); if(g.dataset.li){ setTimeout(()=>{ $('#shareSec').scrollIntoView({block:'start'}); showLi(); },60); } return; }
  const t=e.target.closest('[data-ind]'); if(t){ setInd(t.dataset.ind); show('challenge'); }
});
$('#theme').onclick=()=>{ const dark=isDark(); document.documentElement.dataset.theme=dark?'light':'dark'; syncTheme(); };
function isDark(){const t=document.documentElement.dataset.theme; return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function syncTheme(){ $('#theme use').setAttribute('href',isDark()?'#i-sun':'#i-moon'); }

$('#v-challenge').addEventListener('click',e=>{
  const t=e.target.closest('.task'); if(t){ setTask(+t.dataset.t); return; }
  if(e.target.closest('#toolBtn')){ toast(D().work.tool[1]); return; }
  if(e.target.closest('#sendWork')){ markDone(1); toast(D().work.sent); setTimeout(()=>setTask(2),700); return; }
  const h=e.target.closest('#hints button'); if(h){ sendChat(h.textContent); h.remove(); return; }
  if(e.target.closest('#finish')){ S.finished=true; markDone(3); $('#t3 .fq').outerHTML=doneCard(); }
});
$('#v-challenge').addEventListener('input',e=>{ if(e.target.id==='answer') wc(); });
$('#v-challenge').addEventListener('submit',e=>{ if(e.target.id==='compose'){ e.preventDefault(); sendChat($('#chatIn').value.trim()); } });

$('#v-employer').addEventListener('click',e=>{
  const c=e.target.closest('.cand'); if(c){ S.sel=+c.dataset.i; renderCands(); renderDetail(); if(innerWidth<1000) $('#detail').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const f=e.target.closest('#filters button'); if(f){ S.filt=f.dataset.f; $$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===f)); renderCands(); return; }
  const a=e.target.closest('[data-act]'); if(a){ const n=first(D().cands[S.sel].n);
    toast(a.dataset.act==='invite'?`Invite sent to ${n} with your calendar link.`:a.dataset.act==='read'?'Opens the full submission, the role-play transcript and the follow-up answers.':`${n} gets a kind note and keeps their proof.`); return; }
  if(e.target.closest('#copyLink')) copy(`https://proofofwork.app/c/${D().company.split(' ')[0].toLowerCase()}`,'Challenge link copied.');
  if(e.target.closest('#exportBtn')) toast('Exports a spreadsheet with scores, evidence and links to each submission.');
});
$('#v-proof').addEventListener('click',e=>{
  if(e.target.closest('#liAdd')) showLi();
  else if(e.target.closest('#copyLi')) copy($('#liUrl').textContent,'LinkedIn link copied.');
  else if(e.target.closest('#liPost')) toast('Opens a LinkedIn post with this proof page and its badge image attached.');
  else if(e.target.closest('#dlBadge')) toast('In the live app this saves the badge as a PNG for your profile or CV.');
  else if(e.target.closest('#copyProof')) copy(`https://proofofwork.app/p/${D().id}`,'Proof link copied.');
});
window.addEventListener('hashchange',fromHash);

renderAll(); syncTheme(); fromHash();
</script>
