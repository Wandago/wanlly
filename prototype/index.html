<title>Wanlly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Quiet sidebar, one working column, one composer shared by every tool.
   Every job follows the same rhythm: prompt → working card (sponsor slot) → result → sponsor folds to one line. */
:root{
  --bg:#FBFBFC; --surface:#FFFFFF; --side:#F3F4F7; --line:#E3E5EB; --hover:#E9EBF0;
  --fg:#15171C; --muted:#636A78; --faint:#9AA0AC;
  --accent:#FF5A1F; --accent-ink:#FFFFFF; --accent-soft:#FFEEE6; --accent-line:#FFD2BF;
  --good:#11955A; --bad:#E5484D; --code:#F4F5F8;
  --shadow:0 1px 2px rgba(20,24,35,.04),0 8px 24px rgba(20,24,35,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111216; --surface:#17181D; --side:#0C0D10; --line:#272930; --hover:#1F2127;
  --fg:#ECEDF1; --muted:#979DAA; --faint:#686E7A;
  --accent:#FF6A33; --accent-ink:#140802; --accent-soft:#2C160D; --accent-line:#5A2A16;
  --good:#3CCB85; --bad:#FF6B6F; --code:#0E0F13; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#17181D; --side:#0C0D10; --line:#272930; --hover:#1F2127;
  --fg:#ECEDF1; --muted:#979DAA; --faint:#686E7A;
  --accent:#FF6A33; --accent-ink:#140802; --accent-soft:#2C160D; --accent-line:#5A2A16;
  --good:#3CCB85; --bad:#FF6B6F; --code:#0E0F13; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{flex:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sm{width:15px;height:15px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--fg);display:grid;place-items:center}
.mark span{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.brand b{font-family:var(--f-display);font-weight:650;font-size:20px;letter-spacing:-.02em}
.new{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.new:hover{border-color:var(--faint)}
.new kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 10px 4px;font-weight:500}
.recents{display:flex;flex-direction:column;gap:1px;overflow:auto;min-height:0;flex:1}
.recents button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-align:left;color:var(--muted);font-size:14px;min-width:0}
.recents button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recents button svg{color:var(--faint)}
.recents button:hover{background:var(--hover);color:var(--fg)}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.meter-top{display:flex;align-items:baseline;justify-content:space-between}
.meter-top span{font-size:13px;color:var(--muted)}
.meter-top b{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:550;font-size:14px;border:1px solid var(--accent-line)}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px 2px}
.av{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:13px}
.me div{display:flex;flex-direction:column;line-height:1.25;font-size:14px}
.me small{color:var(--faint);font-size:12px}

/* Main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.menu{display:none;padding:8px;border-radius:10px}
.menu:hover{background:var(--hover)}
.picker{position:relative}
.picker>button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;font-weight:550;font-size:15px}
.picker>button:hover,.picker>button[aria-expanded="true"]{background:var(--hover)}
.picker>button:disabled{background:none}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--hover);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.free{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;width:330px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:20}
.menu-pop h6{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:10px 10px 4px;font-weight:500}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.opt:hover{background:var(--hover)}
.opt b{font-weight:550}
.opt small{grid-column:1;color:var(--muted);font-size:13px}
.opt .tag{grid-row:1/span 2;grid-column:2;align-self:center}
.opt[aria-checked="true"] b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface)}
.pill svg{color:var(--accent);width:15px;height:15px}
.pill:hover{border-color:var(--faint)}
.pill.bump{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.08);border-color:var(--accent)}}

/* Stage + shared dock */
.stage{flex:1;overflow:auto;min-height:0;padding-inline:16px}
.col{max-width:800px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:30px;padding-block:20px 12px}
.dock{padding:6px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .inner{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
main.empty .stage{flex:0 1 auto;margin-top:auto}
main.empty .dock{margin-bottom:auto;padding-bottom:12vh}
.hello{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,5vw,42px);letter-spacing:-.03em;line-height:1.1;text-align:center;margin:0;text-wrap:balance;padding-top:8px}
.hello em{font-style:normal;color:var(--accent)}
.try{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.try button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.try button:hover{color:var(--fg);border-color:var(--faint)}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.composer:focus-within{border-color:var(--faint)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;color:var(--fg);min-height:28px;max-height:200px;padding:2px 4px}
.composer textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;gap:6px}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.round:hover{background:var(--hover);color:var(--fg)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--hover);min-width:0}
.seg button{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.est{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint);white-space:nowrap}
.est.free{color:var(--good)}
.send{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.25}

/* Out-of-credits gate, inside the composer */
.gate{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px}
.gate p{margin:0}
.gate .acts2{display:flex;gap:8px;flex-wrap:wrap}

/* Jobs */
.u{align-self:flex-end;max-width:min(560px,85%);background:var(--hover);padding:10px 15px;border-radius:18px 18px 6px 18px}
.job{display:flex;flex-direction:column;gap:14px}
.out{display:flex;flex-direction:column;gap:12px;min-width:0}
.out p{margin:0}
.out h4{margin:4px 0 0;font-size:15px;font-weight:600}
.out ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.out.in{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6}
.k{color:var(--accent)} .c{color:var(--faint)} .add{color:var(--good)} .del{color:var(--bad)}
.meta{display:flex;align-items:center;gap:2px;color:var(--faint);font-size:12px;font-family:var(--f-mono);flex-wrap:wrap}
.meta button{padding:6px;border-radius:8px;color:var(--faint)}
.meta button:hover{background:var(--hover);color:var(--fg)}
.meta span{margin-left:8px}

/* Working status (same in every tool) */
.status{display:flex;flex-direction:column;gap:8px}
.status .row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
.status time{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.status .bar{height:3px}

/* Sponsor slot: one component, two sizes */
.wait{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;animation:rise .35s ease both}
.wait-b{display:flex;gap:12px;padding:14px;align-items:flex-start}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.wait-b div{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.wait-b b{font-weight:550}
.wait-b p{margin:0;font-size:14px;color:var(--muted)}
.wait-a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ghost{font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px;border:1px solid var(--line);text-decoration:none;color:var(--fg);background:var(--surface)}
.ghost:hover{border-color:var(--faint)}
.watch{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:550;padding:7px 12px;border-radius:9px;background:var(--fg);color:var(--bg)}
.watch .g{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.watch:disabled{background:var(--hover);color:var(--good)}
.line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:2px 0;animation:rise .35s ease both;min-width:0;flex-wrap:wrap}
.line .logo{width:20px;height:20px;border-radius:6px;font-size:10px}
.line b{color:var(--fg);font-weight:550}
.line a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.line .earned{font-family:var(--f-mono);font-size:11px;color:var(--good);padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--good) 12%,transparent)}

/* Inline rewarded spot */
.spot{aspect-ratio:16/7;max-width:100%;background:linear-gradient(135deg,#0F3D2E,#1E7A55);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;gap:2px;position:relative}
.spot b{font-family:var(--f-display);font-size:clamp(20px,3.4vw,26px);letter-spacing:-.02em;line-height:1.05}
.spot small{opacity:.8;font-size:13px}
.spot .ad{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px}
.ptrack{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.ptrack .bar{flex:1;height:4px}
.ptrack .bar i{transition:none}

/* Tool results */
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ctx b{color:var(--fg);font-family:var(--f-mono);font-weight:500;font-size:12px}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--good)}
.ok i{width:7px;height:7px;border-radius:50%;background:currentColor}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:start;font-size:14px}
.steps li:first-child{border-top:0}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px;background:var(--fg);color:var(--bg)}
.dot svg{width:11px;height:11px;stroke-width:3}
.steps small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.steps time{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.primary{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:550;font-size:14px;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;max-width:100%;background:var(--hover)}
.tile canvas{width:100%;height:100%;display:block}
.tile span{position:absolute;left:10px;bottom:10px;font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(10,10,14,.55);color:#fff;font-family:var(--f-mono)}
.board{background:var(--code);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;padding:28px 16px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.phone{width:220px;max-width:100%;aspect-ratio:9/18;background:#0F1014;border-radius:30px;padding:10px;box-shadow:var(--shadow)}
.screen{height:100%;border-radius:22px;background:#FFF7F2;padding:18px 14px;display:flex;flex-direction:column;gap:10px;color:#1B1310}
.screen h3{margin:6px 0 0;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em;line-height:1.1}
.screen .blk{height:64px;border-radius:14px;background:#FF5A1F}
.screen .r{height:11px;border-radius:6px;background:#EADFD8}
.screen .cta{height:40px;border-radius:12px;background:#1B1310;color:#FFF7F2;display:grid;place-items:center;font-weight:600;font-size:13px;margin-top:auto}

/* Earn modal (account-level; jobs use the inline slot) */
.scrim{position:fixed;inset:0;background:rgba(8,9,12,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:440px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal header{display:flex;align-items:flex-start;gap:12px}
.modal h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em}
.modal header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.modal header button{margin-left:auto}
.quest{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);text-align:left;width:100%}
button.quest:hover{border-color:var(--faint)}
.quest .qi{width:40px;height:40px;border-radius:12px;background:var(--hover);display:grid;place-items:center}
.quest b{font-weight:550;display:block}
.quest small{color:var(--muted);font-size:13px}
.gain{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500}
.streak{display:flex;gap:6px;margin-top:6px}
.streak i{flex:1;height:5px;border-radius:99px;background:var(--hover)}
.streak i.on{background:var(--accent)}
.mplayer{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.policy{font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu{display:grid}
  .pill .lbl{display:none}
  .seg button:not([aria-pressed="true"]) span{display:none}
  .grid{gap:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l.9-4A8 8 0 1 1 8 19.6"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></symbol>

<script>
const MODELS=[
  {g:"Anthropic",id:"haiku",n:"Haiku 5.5",d:"Fast everyday answers",c:0},
  {g:"Anthropic",id:"sonnet",n:"Sonnet 5.5",d:"Best balance for chat and code",c:2},
  {g:"Anthropic",id:"opus",n:"Opus 5.5",d:"Deep reasoning, long tasks",c:4},
  {g:"Anthropic",id:"fable",n:"Fable 5.1",d:"Most capable, for the hardest work",c:10},
  {g:"Other providers",id:"gpt",n:"GPT",d:"OpenAI, chat and Codex",c:2},
  {g:"Other providers",id:"grok",n:"Grok",d:"xAI, fast with live web",c:2}
];
/* Each tool shares one flow; only its words, timing, sponsor and result differ. */
const MODES={
  chat:{ph:"Message Wanlly",mult:1,dur:3200,steps:["Thinking","Writing the answer"],
    try:["Explain prompt caching simply","Compare Sonnet and Opus for coding"],
    sp:{n:"Northbeam DB",l:"N",c:"#0E7C66",t:"Usage-based Postgres with a free tier. Good fit for a credits table.",cta:"Learn more"}},
  code:{ph:"Describe a change to wandago/wanlly",mult:3,dur:7000,steps:["Reading 14 files","Planning the change","Editing files","Running tests"],
    try:["Add dark mode to settings","Write tests for the ledger"],
    sp:{n:"Railhouse",l:"R",c:"#2747D8",t:"Your repo is a Next.js app. Deploy this branch to a preview URL with $5 of hosting credit.",cta:"Deploy preview"}},
  design:{ph:"Describe a screen or page",mult:2,dur:5200,steps:["Reading the brief","Laying out the screen","Choosing type and color"],
    try:["Pricing page with three plans","Settings screen, mobile"],
    sp:{n:"Typecase",l:"T",c:"#3A3340",t:"The display face in this mock is free for your first project.",cta:"Get the font"}},
  images:{ph:"Describe an image",fixed:3,dur:4800,steps:["Composing","Rendering 4 images","Upscaling"],
    try:["Mug on a sunlit counter, film grain","Flat-lay of a desk setup"],
    sp:{n:"Printwell",l:"P",c:"#B4235A",t:"Turn any of these into a poster or a mug. First print ships free.",cta:"See prints"}}
};
const S={mode:"chat",model:"sonnet",credits:9,max:40};
const $=s=>document.querySelector(s);
const ic=(n,c="")=>`<svg class="ico ${c}"><use href="#i-${n}"/></svg>`;
const esc=s=>s.replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const cur=()=>MODELS.find(m=>m.id===S.model);
const price=(mode=S.mode)=>MODES[mode].fixed??cur().c*MODES[mode].mult;
const tag=c=>c===0?'<span class="tag free">Free</span>':`<span class="tag">${c} cr</span>`;

/* Stages persist per tool, so a running job keeps going when you switch tools */
const stages={};
function stageFor(mode){
  if(stages[mode])return stages[mode];
  const el=document.createElement("div");el.className="col";stages[mode]=el;
  if(mode==="chat")el.innerHTML=`<h1 class="hello">What are we <em>making</em> today?</h1>`;
  else runJob(mode,SAMPLE[mode],{instant:true});
  return el;
}
const SAMPLE={code:"Add a credit ledger that charges each model call in half-cents",images:"A ceramic mug on a sunlit kitchen counter, morning light",design:"Onboarding screen for a habit app. Warm, confident, one clear action."};

function setMode(mode,opts={}){
  S.mode=mode;
  const st=$("#stage");st.innerHTML="";st.appendChild(stageFor(mode));
  if(opts.sample&&mode==="chat"&&!stages.chat.querySelector(".job"))runJob("chat","How should I price an AI app that's free for most people but still profitable?",{instant:true,sample:true});
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#ta").placeholder=MODES[mode].ph;
  $("#try").innerHTML=MODES[mode].try.map(t=>`<button data-fill>${t}</button>`).join("");
  $("#gate").hidden=true;
  refresh(); $("#side").classList.remove("open");
  st.scrollTop=st.scrollHeight;
}
function refresh(){
  const empty=S.mode==="chat"&&!stages.chat?.querySelector(".job");
  $("#main").classList.toggle("empty",empty); $("#try").hidden=!empty&&S.mode==="chat";
  const m=cur(),img=S.mode==="images";
  $("#pickBtn").disabled=img;
  $("#pickBtn").innerHTML=img?`Wanlly Image <span class="tag">3 cr</span>`:`${m.n} ${tag(m.c)}${ic("down","sm")}`;
  let h="",g="";MODELS.forEach(x=>{if(x.g!==g){g=x.g;h+=`<h6>${g}</h6>`}
    h+=`<button class="opt" role="menuitemradio" aria-checked="${x.id===S.model}" data-model="${x.id}"><b>${x.n}</b><small>${x.d}</small>${tag(x.c)}</button>`});
  $("#pickPop").innerHTML=h;
  const p=price(),e=$("#est");e.textContent=p===0?"Free":`${p} cr`;e.classList.toggle("free",p===0);
  $("#mNum").textContent=`${S.credits} / ${S.max}`;$("#pNum").textContent=S.credits;
  $("#mBar").style.width=Math.min(100,S.credits/S.max*100)+"%";
  $("#send").disabled=!$("#ta").value.trim();
}
function earn(n,why){S.credits+=n;refresh();const p=$("#pill");p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");toast(`+${n} credits${why?" · "+why:""}`)}

/* Sponsor slot: card while working, one line after */
const card=sp=>`<div class="wait"><div class="wait-b"><div class="logo" style="background:${sp.c}">${sp.l}</div>
  <div><span class="eyebrow">While you wait · Sponsored</span><b>${sp.n}</b><p>${sp.t}</p></div></div>
  <div class="wait-a"><a class="ghost" href="#" data-noop>${sp.cta}</a><button class="watch" data-watch>${ic("play","sm")}Watch 20s <span class="g">+4</span></button></div></div>`;
const line=(sp,earned)=>`<div class="line"><div class="logo" style="background:${sp.c}">${sp.l}</div><span class="eyebrow">Sponsored</span><span><b>${sp.n}</b> · <a href="#" data-noop>${sp.cta}</a></span>${earned?`<span class="earned">+${earned} earned</span>`:""}</div>`;

/* Rewarded spot that plays in place, wherever it's started */
function playIn(box,done){
  const T=5;let t=0;
  box.innerHTML=`<div class="spot"><span class="ad">Sponsored</span><small>Fieldnote</small><b>Notes that organize themselves.</b><small>Free for students</small></div>
  <div class="ptrack"><span class="pt">0:00</span><div class="bar"><i></i></div><span>+4</span></div>`;
  const bar=box.querySelector(".bar i"),pt=box.querySelector(".pt");
  const iv=setInterval(()=>{t+=.1;const f=Math.min(1,t/T);bar.style.width=f*100+"%";pt.textContent="0:0"+Math.floor(t);
    if(f>=1){clearInterval(iv);done()}},100);
}

let jid=0;
function runJob(mode,prompt,{instant=false,sample=false}={}){
  const M=MODES[mode],col=stageFor(mode),id=++jid;
  col.querySelector(".hello")?.remove();
  const job=document.createElement("div");job.className="job";
  job.innerHTML=`<div class="u">${esc(prompt)}</div><div class="out"></div><div class="slot"></div>`;
  col.appendChild(job);
  const out=job.querySelector(".out"),slot=job.querySelector(".slot");
  const model=mode==="images"?"Wanlly Image":cur().n, cost=price(mode);
  if(instant){out.innerHTML=RESULT[mode](prompt,sample,model,cost);slot.innerHTML=line(M.sp);paint(out);return}
  // working state
  let step=0,secs=0;
  out.innerHTML=`<div class="status"><div class="row"><span class="spin"></span><span class="st">${M.steps[0]}</span><time>0:00</time></div><div class="bar"><i></i></div></div>`;
  slot.innerHTML=card(M.sp);
  requestAnimationFrame(()=>{const b=out.querySelector(".bar i");b.style.transition=`width ${M.dur}ms linear`;b.style.width="100%"});
  const tick=setInterval(()=>{secs++;const t=out.querySelector("time");if(t)t.textContent="0:"+String(secs).padStart(2,"0")},1000);
  const stepper=setInterval(()=>{step=Math.min(step+1,M.steps.length-1);const s=out.querySelector(".st");if(s)s.textContent=M.steps[step]},M.dur/M.steps.length);
  job._sp=M.sp;
  setTimeout(()=>{clearInterval(tick);clearInterval(stepper);
    out.innerHTML=RESULT[mode](prompt,false,model,cost);out.classList.add("in");paint(out);
    job._done=true; if(!job._playing)slot.innerHTML=line(M.sp,job._earned);
    if(S.mode===mode)$("#stage").scrollTop=$("#stage").scrollHeight;
  },M.dur);
  refresh(); $("#stage").scrollTop=$("#stage").scrollHeight;
}

const meta=(model,cost)=>`<div class="meta"><button aria-label="Copy">${ic("copy","sm")}</button><button aria-label="Retry">${ic("redo","sm")}</button><span>${model} · ${cost?cost+" cr":"free"}</span></div>`;
const RESULT={
  chat:(q,sample,model,cost)=>sample?`
    <p>Treat ads as something that <b>earns credits</b>, and models as something that <b>spends</b> them. Then every user has a balance you can measure in real cents.</p>
    <h4>A setup that holds up</h4>
    <ol><li>A free daily allowance that covers light use on a small model.</li><li>Opt-in sponsor spots that top up credits for bigger models.</li><li>A paid plan for people who go past what ads can cover.</li></ol>
    <pre><span class="c">// credits are integer half-cents</span>
<span class="k">const</span> cost = usage.input * rate.in + usage.output * rate.out;
ledger.debit(user, Math.ceil(cost / 0.005));</pre>
    <p>Keep sponsors beside the work, never inside the answer.</p>${meta("Sonnet 5.5",2)}`
    :`<p>This is a design prototype, so replies aren't connected to a model yet. Once the backend is in, <b>${model}</b> streams its answer here, in the same spot the working card held.</p>${meta(model,cost)}`,
  code:(q,s,model,cost)=>`
    <div class="ctx">${ic("gh","sm")}<b>wandago/wanlly</b> on <b>main</b><span class="ok"><i></i>Connected</span></div>
    <ol class="steps">
      <li><span class="dot">${ic("check")}</span><div>Read the project<small>14 files · app/api/chat/route.ts</small></div><time>0:12</time></li>
      <li><span class="dot">${ic("check")}</span><div>Planned the change<small>ledger table, debit on stream end, refund on error</small></div><time>0:31</time></li>
      <li><span class="dot">${ic("check")}</span><div>Edited 3 files<small>+86 −4 · lib/ledger.ts, db/schema.ts, route.ts</small></div><time>1:48</time></li>
      <li><span class="dot">${ic("check")}</span><div>Tests pass<small>vitest · 31 of 31</small></div><time>2:20</time></li>
    </ol>
    <pre><span class="c">lib/ledger.ts</span>
<span class="add">+ export async function debit(userId: string, halfCents: number) {</span>
<span class="add">+   const bal = await db.balance(userId);</span>
<span class="add">+   if (bal &lt; halfCents) throw new OutOfCredits(bal);</span>
<span class="add">+   return db.insert(entries).values({ userId, delta: -halfCents });</span>
<span class="add">+ }</span>
<span class="del">- // TODO: track usage</span></pre>
    <button class="primary" data-noop>${ic("pr","sm")}Open pull request</button>${meta(model,cost)}`,
  images:(q,s,model,cost)=>`<div class="grid">${["Sunlit","Moody","Wide","Close-up"].map(n=>`<div class="tile"><canvas width="400" height="400"></canvas><span>${n}</span></div>`).join("")}</div>${meta(model,cost)}`,
  design:(q,s,model,cost)=>`<div class="board"><div class="phone"><div class="screen">
    <small style="font-family:var(--f-mono);opacity:.6">Day 1</small><h3>Small steps, every single day.</h3>
    <div class="blk"></div><div class="r"></div><div class="r" style="width:60%"></div><div class="cta">Start my streak</div></div></div></div>${meta(model,cost)}`
};
let seed=0;
function paint(out){
  const pals=[["#F2B48A","#E06A3B","#3B2A22"],["#BFD8D2","#5E8C7F","#1E2B28"],["#F4E3B5","#D99A2B","#4A3418"],["#D7C9F0","#7D62C4","#24193D"],["#F7C9C9","#D9525E","#3A1519"],["#C9DDF7","#3E78C9","#14233A"]];
  out.querySelectorAll("canvas").forEach((cv,i)=>{
    const x=cv.getContext("2d"),p=pals[(i+seed)%pals.length],gr=x.createLinearGradient(0,0,400,400);
    gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);x.fillStyle=gr;x.fillRect(0,0,400,400);
    x.fillStyle=p[2];x.globalAlpha=.85;x.beginPath();x.ellipse(200,330,130,26,0,0,7);x.fill();
    x.globalAlpha=1;x.fillStyle=p[0];x.fillRect(150,170,100,150);x.beginPath();x.ellipse(200,170,50,12,0,0,7);x.fill();
    x.strokeStyle=p[0];x.lineWidth=14;x.beginPath();x.arc(258,240,30,-1.3,1.3);x.stroke();
    x.globalAlpha=.18;x.fillStyle="#fff";x.beginPath();x.moveTo(0,0);x.lineTo(180,0);x.lineTo(400,260);x.lineTo(400,400);x.fill();x.globalAlpha=1;
  });
  if(out.querySelector("canvas"))seed+=2;
}

function submit(){
  const ta=$("#ta"),q=ta.value.trim();if(!q)return;
  const cost=price();
  if(cost>S.credits){showGate(cost);return}
  S.credits-=cost; ta.value="";ta.style.height="auto";$("#gate").hidden=true;
  runJob(S.mode,q);
}
function showGate(cost){
  const g=$("#gate"),m=cur(),img=S.mode==="images",need=cost-S.credits;
  g.innerHTML=`<p><b>${img?"Images":m.n}</b> needs ${cost} credits here and you have ${S.credits}. Watch ${Math.ceil(need/4)>1?Math.ceil(need/4)+" short spots":"one short spot"}${img?"":", or switch to Haiku 5.5 for free"}.</p>
    <div class="acts2"><button class="watch" style="margin:0" data-gatewatch>${ic("play","sm")}Watch 20s <span class="g">+4</span></button>${img?"":`<button class="ghost" data-haiku>Use Haiku 5.5 free</button>`}</div>`;
  g.hidden=false;
}

function openEarn(){
  const M=$("#modal");
  M.innerHTML=`<header><div><h3 id="mTitle">Earn credits</h3><p>Every option is optional and labeled.</p></div><button class="round" data-close aria-label="Close">${ic("x")}</button></header>
  <button class="quest" data-mwatch><span class="qi">${ic("play")}</span><span><b>Watch a 20s spot</b><small>Or press Watch on any working card</small></span><span class="gain">+4</span></button>
  <button class="quest" data-try><span class="qi">${ic("gift")}</span><span><b>Try a sponsor's tool</b><small>Northbeam DB · create a free database</small></span><span class="gain">+25</span></button>
  <div class="quest"><span class="qi">${ic("flame")}</span><span><b>Daily streak · 3 of 5</b><small>Two more days for a free Fable 5.1 answer</small><span class="streak"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></span><span class="gain">+10</span></div>
  <p class="policy">Sponsors never appear inside an answer and never change what a model says. Need more than ads cover? Plus is $8/month.</p>`;
  $("#scrim").hidden=false;M.querySelector("[data-close]").focus();
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2200)}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.hasAttribute("data-noop")){e.preventDefault();toast("Opens the sponsor in a new tab");return}
  if(t.id==="pickBtn"){const p=$("#pickPop"),o=p.hidden;p.hidden=!o;t.setAttribute("aria-expanded",o);return}
  if(t.dataset.model){S.model=t.dataset.model;$("#pickPop").hidden=true;$("#pickBtn").setAttribute("aria-expanded","false");$("#gate").hidden=true;refresh();return}
  if(t.dataset.mode){setMode(t.dataset.mode,{sample:t.hasAttribute("data-sample")});return}
  if(t.hasAttribute("data-new")){delete stages.chat;setMode("chat");$("#ta").focus();return}
  if(t.hasAttribute("data-fill")){const ta=$("#ta");ta.value=t.textContent;refresh();ta.focus();return}
  if(t.hasAttribute("data-earn")){openEarn();return}
  if(t.hasAttribute("data-close")){$("#scrim").hidden=true;return}
  if(t.hasAttribute("data-watch")){
    const job=t.closest(".job"),slot=job.querySelector(".slot"),box=slot.querySelector(".wait");
    job._playing=true;
    playIn(box,()=>{job._playing=false;job._earned=4;earn(4,"thanks for watching");
      slot.innerHTML=job._done?line(job._sp,4):card(job._sp);
      if(!job._done){const w=slot.querySelector("[data-watch]");w.disabled=true;w.innerHTML=`${ic("check","sm")}+4 earned`}});
    return}
  if(t.hasAttribute("data-gatewatch")){
    const g=$("#gate");g.innerHTML=`<div class="mplayer"></div>`;
    playIn(g.firstChild,()=>{earn(4);const c=price();
      if(c<=S.credits){g.innerHTML=`<p><b>You're set.</b> Press send to run it.</p>`;setTimeout(()=>g.hidden=true,2500)}else showGate(c)});
    return}
  if(t.hasAttribute("data-haiku")){S.model="haiku";$("#gate").hidden=true;refresh();toast("Switched to Haiku 5.5, free");return}
  if(t.hasAttribute("data-mwatch")){const M=$("#modal");M.innerHTML=`<div class="mplayer"></div>`;
    playIn(M.firstChild,()=>{earn(4);$("#scrim").hidden=true});return}
  if(t.hasAttribute("data-try")){earn(25,"sponsor trial");$("#scrim").hidden=true;return}
  if(t.id==="menuBtn"){$("#side").classList.toggle("open");return}
  if(t.id==="send"){submit();return}
});
document.addEventListener("click",e=>{if(!e.target.closest(".picker"))$("#pickPop").hidden=true});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")$("#scrim").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#scrim").hidden=true;$("#pickPop").hidden=true}});
const ta=$("#ta");
ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";refresh()});
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});

setMode("chat");
</script>
