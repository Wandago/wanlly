<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: white SaaS shell. Sticky top bar (edition switcher), left sidebar nav, one working column.
   The platform is neutral (ink on white, one small edition accent). Only the booking page inside the phone
   carries a business's own brand: colour (--b*), heading font (--bf) and corner style (--br / --bp). */
:root{
  --page:#FAFAFA; --surface:#FFFFFF; --sunk:#F4F4F5; --line:#E4E4E7; --line-2:#D4D4D8;
  --ink:#18181B; --muted:#52525B; --faint:#8B8B94; --on-ink:#FAFAFA;
  --acc:#E8457F; --acc-soft:#FDECF2;
  --ok:#15803D; --ok-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FEF3E2; --wa:#1FA855; --wa-bub:#DCF8C6; --wa-bg:#F1ECE4;
  --shadow:0 1px 2px rgba(24,24,27,.05),0 12px 32px rgba(24,24,27,.08);
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-serif:"Instrument Serif",ui-serif,Georgia,serif;
  --b:#FF9CC2; --b-ink:#3A0B20; --b-deep:#3A0B20; --b-soft:#FFE9F1; --bf:var(--f); --br:18px; --bp:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#09090B; --surface:#131316; --sunk:#1C1C20; --line:#27272A; --line-2:#3F3F46;
  --ink:#FAFAFA; --muted:#A1A1AA; --faint:#71717A; --on-ink:#18181B; --acc-soft:#2A1420;
  --ok:#4ADE80; --ok-soft:#102A1A; --warn:#FBBF24; --warn-soft:#2B2008; --wa-bub:#1E4D33; --wa-bg:#101512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#09090B; --surface:#131316; --sunk:#1C1C20; --line:#27272A; --line-2:#3F3F46;
  --ink:#FAFAFA; --muted:#A1A1AA; --faint:#71717A; --on-ink:#18181B; --acc-soft:#2A1420;
  --ok:#4ADE80; --ok-soft:#102A1A; --warn:#FBBF24; --warn-soft:#2B2008; --wa-bub:#1E4D33; --wa-bg:#101512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-weight:650;letter-spacing:-.025em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:550;font-size:14px;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.ink{background:var(--ink);color:var(--on-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:13px}
.tgl{width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.tgl[aria-checked="true"]{background:var(--ok)}
.tgl[aria-checked="true"]::after{transform:translateX(16px)}

/* ---------- top bar ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .r{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.logo .lm{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.logo .lm svg{width:15px;height:15px;stroke-width:2.2}
.logo small{font-weight:450;font-size:12.5px;color:var(--faint);letter-spacing:0}
.eds{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--sunk);overflow-x:auto;scrollbar-width:none;max-width:100%}
.eds button{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted);white-space:nowrap}
.eds button i{width:8px;height:8px;border-radius:50%}
.eds button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hdr .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.icb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.icb:hover{background:var(--sunk);color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1400px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);align-self:start;height:calc(100vh - 59px - env(safe-area-inset-top,0px));padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .gl{font-size:11.5px;font-weight:550;color:var(--faint);padding:14px 10px 6px;text-transform:uppercase;letter-spacing:.06em}
.side .gl:first-child{padding-top:2px}
.side button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px;text-align:left;width:100%}
.side button:hover{background:var(--sunk);color:var(--ink)}
.side button[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600}
.side button[aria-current="page"] .ico{color:var(--acc)}
.side button .n{margin-left:auto;font-size:11px;font-weight:600;background:var(--acc);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side .biz{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.side .biz b{display:block;font-size:14px}
.side .biz small{color:var(--faint)}
main{min-width:0;padding-block:28px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{display:none}.view.on{display:block}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vhead .ey{font-size:13px;font-weight:550;color:var(--acc);display:block;margin-bottom:4px}
.vhead h1{font-size:clamp(24px,3vw,30px)}
.vhead p{margin:6px 0 0;color:var(--muted);max-width:66ch}

/* ---------- browser stage: the customer-facing website ---------- */
.stage{display:flex;flex-direction:column;gap:16px}
.stage-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stage-top h2{font-size:24px;line-height:1.15}
.stage-top p{color:var(--muted);margin:6px 0 0;max-width:68ch}
.dev{display:flex;padding:3px;border-radius:10px;background:var(--sunk);gap:2px}
.dev button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted)}
.dev button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.note b{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-bottom:2px}
.note b i{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:650;flex:none}
.note p{margin:0;font-size:13.5px;color:var(--muted)}
.browser{width:100%;margin:0 auto;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.browser.mob{width:390px;max-width:100%}
.bbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.bbar .dots{display:flex;gap:6px}
.bbar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.bbar .url{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{height:720px;overflow:auto;position:relative;scrollbar-width:thin;container-type:inline-size;color:#18181B;
  --page:#F7F6F3; --surface:#FFFFFF; --sunk:#EFEDE8; --line:#E4E1DA; --line-2:#CFCBC2; --ink:#18181B; --muted:#55524C; --faint:#8C8880; --on-ink:#FAFAFA;
  --ok:#15803D; --ok-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FEF3E2; --wa-bub:#DCF8C6; --wa-bg:#F1ECE4;
  background:var(--page)}
.scr h1,.scr h2,.scr h3{font-family:var(--bf);color:inherit}

/* booking page (business-styled) */
.cp-top{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--b-deep);color:#fff;position:sticky;top:0;z-index:5}
.cp-top .nm{display:flex;align-items:center;gap:8px;font-family:var(--bf);font-weight:650;letter-spacing:var(--bls,-.02em);font-size:16px}
.cp-top .mk{width:28px;height:28px;border-radius:var(--bp);background:var(--b);color:var(--b-ink);display:grid;place-items:center}
.cp-top .ics{display:flex;gap:6px}
.cp-top .ics span{width:30px;height:30px;border-radius:var(--bp);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center}
.cp-hero{background:radial-gradient(70% 60% at 85% 15%,color-mix(in srgb,var(--b) 28%,transparent),transparent 70%),var(--b-deep);color:#fff;padding:20px 18px 24px;position:relative;overflow:hidden}
.cp-hero .art{position:absolute;right:-18px;bottom:-14px;width:130px;height:130px;color:var(--b);opacity:.22;stroke-width:1.2}
.cp-hero .rt{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:550;padding:3px 10px;border-radius:var(--bp);background:rgba(255,255,255,.12)}
.cp-hero h1{font-size:34px;line-height:1.03;letter-spacing:var(--bls,-.035em);margin:14px 0 10px;max-width:290px;font-weight:650}
.cp-hero h1 em{font-style:normal;color:var(--b)}
.cp-hero p{margin:0 0 16px;color:rgba(255,255,255,.75);font-size:14px;max-width:290px}
.cp-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.bbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--bp);font-weight:650;font-size:15px;background:var(--b);color:var(--b-ink)}
.wbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 15px;border-radius:var(--bp);font-weight:600;font-size:15px;background:var(--wa);color:#fff}
.cp-hero .next{margin-top:13px;font-size:12.5px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px}
.cp-hero .next i{width:7px;height:7px;border-radius:50%;background:var(--b)}
.offer{margin:14px;padding:13px 15px;border-radius:var(--br);background:var(--b-soft);border:1px solid color-mix(in srgb,var(--b-deep) 18%,transparent);display:flex;gap:11px;align-items:center;color:var(--b-deep)}
.offer b{display:block;line-height:1.2;font-size:14.5px}
.offer small{font-size:12.5px;opacity:.8}
.cp-sec{padding:14px 16px}
.cp-sec h3{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;font-weight:650}
.cp-sec h3 small{font-family:var(--f);font-size:12.5px;font-weight:450;color:var(--faint);letter-spacing:0}
.sg{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:14px 0 6px}
.svc{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--br);width:100%;text-align:left;color:var(--ink)}
.svc + .svc{margin-top:6px}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font-size:14.5px;font-weight:600}
.svc .t small{color:var(--faint);font-size:12.5px}
.svc .p{font-weight:650;font-size:15px;white-space:nowrap}
.svc .go{width:28px;height:28px;border-radius:var(--bp);background:var(--b-deep);color:var(--b);display:grid;place-items:center}
.svc[aria-pressed="true"]{border-color:var(--b-deep);box-shadow:inset 0 0 0 1.5px var(--b-deep);background:var(--b-soft)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gt{aspect-ratio:4/3;border-radius:var(--br);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:9px;color:#fff;font-size:12px;font-weight:600}
.gt svg{position:absolute;right:8px;top:8px;width:44px;height:44px;opacity:.5;stroke-width:1.3}
.gt span{position:relative;background:rgba(0,0,0,.28);padding:2px 8px;border-radius:var(--bp)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--br);padding:13px}
.rv q{display:block;font-size:14.5px;line-height:1.45;quotes:"“" "”"}
.rv small{display:block;color:var(--faint);font-size:12.5px;margin-top:6px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--br);padding:12px;display:flex;flex-direction:column;gap:3px}
.prod b{font-size:14px;line-height:1.25}
.prod small{color:var(--faint);font-size:12px}
.prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.prod .row span{font-weight:650}
.prod .row button{font-size:12.5px;font-weight:650;padding:4px 11px;border-radius:var(--bp);background:var(--b-deep);color:var(--b)}
.know{display:flex;flex-direction:column;gap:8px}
.know div{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--br);padding:11px 13px;font-size:13.5px;align-items:flex-start}
.know svg{color:var(--b-deep);margin-top:2px}
.cp-foot{background:var(--b-deep);color:rgba(255,255,255,.72);padding:16px 16px 84px;font-size:12.5px;margin-top:10px}
.cp-foot b{color:#fff}
.sticky-bar{position:sticky;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 12px 14px;background:linear-gradient(transparent,var(--page) 30%)}
.sticky-bar .bbtn{flex:1}
.sticky-bar .wbtn{padding:12px 14px}
/* booking flow */
.bk-top{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--b-deep);color:#fff;position:sticky;top:0;z-index:5}
.bk-top button{width:30px;height:30px;border-radius:var(--bp);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
.bk-top b{font-family:var(--bf);font-size:16px;letter-spacing:-.02em}
.steps{display:flex;gap:4px;padding:12px 16px 0}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--b-deep)}
.bk{padding:16px;display:flex;flex-direction:column;gap:11px}
.bk h2{font-size:23px;line-height:1.1;font-weight:650}
.bk .sub{color:var(--muted);font-size:13.5px;margin:-4px 0 2px}
.seg2{display:flex;padding:3px;border-radius:var(--bp);background:var(--sunk);gap:2px}
.seg2 button{flex:1;padding:8px 10px;border-radius:var(--bp);font-size:13px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day{min-width:54px;padding:8px 6px;border-radius:var(--br);border:1px solid var(--line);background:var(--surface);text-align:center;font-size:11.5px;color:var(--muted)}
.day b{display:block;font-size:19px;color:var(--ink);line-height:1.15;font-weight:650}
.day[aria-pressed="true"]{background:var(--b-deep);border-color:var(--b-deep);color:rgba(255,255,255,.75)}
.day[aria-pressed="true"] b{color:var(--b)}
.day:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{padding:10px 4px;border-radius:calc(var(--br) * .7);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot:disabled{text-decoration:line-through;color:var(--faint);background:var(--sunk)}
.slot[aria-pressed="true"]{background:var(--b);border-color:var(--b-deep);color:var(--b-ink)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input{padding:10px 12px;border-radius:calc(var(--br) * .7);border:1px solid var(--line-2);background:var(--surface);min-width:0;color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--b-deep)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--br);padding:12px 14px;font-size:13.5px}
.q b{display:block;margin-bottom:3px;font-weight:600;font-size:14px}
.q .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.q .opts button{padding:6px 12px;border-radius:var(--bp);border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink)}
.q .opts button[aria-pressed="true"]{background:var(--b-deep);color:var(--b);border-color:var(--b-deep)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:var(--br);background:var(--sunk);text-align:left;width:100%;color:var(--ink)}
.chk .bx{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;background:var(--surface);margin-top:1px}
.chk[aria-checked="true"] .bx{background:var(--b-deep);border-color:var(--b-deep);color:var(--b)}
.chk .bx svg{width:13px;height:13px;stroke-width:3;opacity:0}
.chk[aria-checked="true"] .bx svg{opacity:1}
.priv{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--br);padding:13px}
.sum .r2{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.sum .r2.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:650}
.pay{display:flex;flex-direction:column;gap:8px}
.pay button{padding:13px;border-radius:var(--br);font-weight:650;font-size:15px}
.pay .p1{background:var(--ink);color:#fff}
.pay .p2{border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.bk-foot{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,var(--page) 25%)}
.bk-foot .bbtn{width:100%}
.bk-foot .bbtn:disabled{opacity:.45;cursor:default}
.done{text-align:center;padding:22px 16px}

function patchOpts(){const o=[];for(let i=0;i<=S.day-2&&o.length<3;i++) if(!CLOSED.includes(i)) o.push(`${DAYS[i][0]} ${DAYS[i][1]}, ${i?'6pm':'5pm'}`);return o;}
function extraOn(){const e=D().extra,it=ITEMS()[S.item]; return !!e&&(!e.newOnly||(S.newc&&!!it.flag));}
function extraOpts(){const e=D().extra; return e.opts==='patch'?patchOpts():e.opts;}
function fitAmt(it){const x=S.extra||''; return x.startsWith('Intro')?30:x.startsWith('Class pack')?0:it.fee;}
function confirmMsg(){
  const d=D(),it=ITEMS()[S.item],when=`${DAYS[S.day][0]} ${DAYS[S.day][1]} Nov at ${S.slot}`,nm=d.persona[0].split(' ')[0];
  const mid={glow:(extraOn()?`Patch test: ${S.extra}\n`:'')+'Deposit received: $20',care:`With: ${S.extra==='First available'?'Dr Amara Cole':S.extra}\nPlease arrive 10 minutes early.`,view:S.extra==='Live video tour'?'We’ll send your video link 10 minutes before.':'Your agent Maya will meet you outside. Please bring photo ID.',fit:`Paid with: ${S.extra}\nBring grip socks and water.`}[S.ed];
  return `Hi ${nm}! You’re booked: ${it.n}, ${when}.\n\n${mid}\n📍 ${d.area}`;
}
function renderBook(){
  const d=D(), items=ITEMS(), it=items[S.item], pay=d.pay;
  const total=it.fee?Math.round(it.fee*(d.firstOff&&S.newc&&it.flag?1-d.firstOff:1)):0;
  let body='', foot='', can=true;
  if(S.step===1){
    body=`<h2>What would you like to book?</h2>
      <div class="seg2" role="group">${d.toggle.map((t,i)=>`<button data-newc="${i?0:1}" aria-pressed="${S.newc===!i}">${t}</button>`).join('')}</div>
      ${d.cat.map(([g,list])=>`<div class="sg" style="margin:4px 0 0">${g}</div>${list.map(([k,n,m,p])=>`<button class="svc" data-pick="${k}" aria-pressed="${k===S.item}"><span class="t"><b>${esc(n)}</b><small>${esc(m)}</small></span><span class="p">${p}</span></button>`).join('')}`).join('')}`;
  } else if(S.step===2){
    const tk=TAKEN[S.day]||[], ex=d.extra, opts=extraOn()?extraOpts():[];
    body=`<h2>Pick a time</h2><p class="sub">${esc(it.n)} · ${esc(it.d)}</p>
      <div class="days">${DAYS.map(([dd,n],i)=>`<button class="day" data-day="${i}" aria-pressed="${i===S.day}" ${CLOSED.includes(i)?'disabled':''}>${dd}<b>${n}</b>${(TAKEN[i]||[]).length>=SLOTS.length?'Full':CLOSED.includes(i)?'Closed':'Nov'}</button>`).join('')}</div>
      <div class="slots">${SLOTS.map((s,i)=>`<button class="slot" data-slot="${s}" aria-pressed="${S.slot===s}" ${tk.includes(i)?'disabled':''}>${s}</button>`).join('')}</div>
      ${tk.length>=SLOTS.length?`<button class="chk" data-wait="1" aria-checked="false"><span class="bx">${ico('i-check')}</span><span>This day is full. <b>Join the waitlist</b> and get a message if a slot opens.</span></button>`:''}
      ${extraOn()?`<div class="q"><b>${esc(ex.t)}</b><span class="faint">${esc(ex.h)}</span><div class="opts">${opts.length?opts.map(t=>`<button data-extra="${esc(t)}" aria-pressed="${S.extra===t}">${esc(t)}</button>`).join(''):'<span class="pill warn">Too soon. Pick Wed 11 or later.</span>'}</div></div>`:''}`;
    can=!!S.slot&&(!extraOn()||!!S.extra);
  } else if(S.step===3){
    body=`<h2>Your details</h2>
      <div class="fld"><label for="bName">Name</label><input id="bName" value="${esc(d.persona[0])}" autocomplete="off"></div>
      <div class="fld"><label for="bPhone">WhatsApp number</label><input id="bPhone" value="${esc(d.persona[1])}" autocomplete="off"></div>
      ${d.qs.map(([q,o],qi)=>`<div class="q"><b>${esc(q)}</b><div class="opts">${o.map(x=>`<button data-q="${qi}" data-a="${esc(x)}" aria-pressed="${(S.ans[qi]||o[0])===x}">${esc(x)}</button>`).join('')}</div></div>`).join('')}
      ${d.qNote?`<div class="priv">${ico('i-lock','width:15px;height:15px;margin-top:2px')}<span>${esc(d.qNote)}</span></div>`:''}
      <button class="chk" data-c="svc" role="checkbox" aria-checked="${S.consent.svc}"><span class="bx">${ico('i-check')}</span><span>Send my confirmation and reminders on WhatsApp</span></button>
      <button class="chk" data-c="mk" role="checkbox" aria-checked="${S.consent.mk}"><span class="bx">${ico('i-check')}</span><span>Send me updates and offers (optional, stop anytime)</span></button>`;
  } else if(S.step===4){
    const when=`${DAYS[S.day][0]} ${DAYS[S.day][1]} Nov · ${S.slot}`, amt=S.ed==='fit'?fitAmt(it):pay.amt;
    const sub=S.ed==='fit'?(amt===30?'Intro offer: 3 classes for $30. This booking uses the first one.':amt?'One class, paid now.':'Uses one credit from your class pack.'):pay.s;
    const rows=[`<div class="r2"><span>${esc(it.n)}</span><span>${it.p}</span></div>`];
    if(d.firstOff&&S.newc&&it.flag) rows.push(`<div class="r2"><span>First-visit ${d.firstOff*100}% off</span><span>−$${it.fee-total}</span></div>`);
    rows.push(`<div class="r2"><span>${when}</span><span></span></div>`);
    if(extraOn()) rows.push(`<div class="r2"><span>${esc(d.extra.t.split(' (')[0].replace('?',''))}</span><span>${esc(S.extra)}</span></div>`);
    if(pay.mode==='deposit') rows.push(`<div class="r2 t"><span>Deposit today</span><span>$${amt}</span></div><div class="r2"><span class="faint">Left to pay on the day</span><span class="faint">$${total-amt}</span></div>`);
    if(pay.mode==='full') rows.push(`<div class="r2 t"><span>To pay now</span><span>$${amt}</span></div>`);
    if(pay.mode==='hold') rows.push(`<div class="r2 t"><span>Charged today</span><span>$0</span></div>`);
    if(pay.mode==='none') rows.push(`<div class="r2 t"><span>Cost</span><span>Free</span></div>`);
    const btns=(pay.mode==='deposit'||(pay.mode==='full'&&amt))?`<button class="p1" data-pay="1">Pay $${amt} with Apple Pay</button><button class="p2" data-pay="1">Pay with card</button>`:`<button class="p1" data-pay="1">${pay.mode==='full'?'Use 1 credit and confirm':pay.btn}</button>`;
    body=`<h2>${esc(pay.h)}</h2><p class="sub">${esc(sub)}</p><div class="sum">${rows.join('')}</div>
      ${pay.fine?`<div class="priv">${ico('i-clock','width:15px;height:15px;margin-top:2px')}<span>${esc(pay.fine)}</span></div>`:''}
      <div class="pay">${btns}</div>
      <p class="faint" style="font-size:12px;margin:0">Prototype only: nothing is charged and no code is sent.</p>`;
  } else {
    body=`<div class="done"><div class="okc">${ico('i-check')}</div><h2>You’re booked</h2>
      <p class="sub" style="margin-top:6px">${esc(it.n)} · ${DAYS[S.day][0]} ${DAYS[S.day][1]} Nov at ${S.slot}</p>
      <div class="wa-prev"><div class="h">${ico('i-wa','width:14px;height:14px;color:var(--wa)')}WhatsApp from ${esc(d.biz)}</div><div class="wa-msg">${esc(confirmMsg())}<small>${S.slot} ✓✓</small></div></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-cal="1">${ico('i-cal')}Add to calendar</button><button class="btn sm" data-restart="1">Book another</button></div></div>`;
  }
  if(S.step<4) foot=`<div class="bk-foot"><button class="bbtn" id="bkNext" ${can?'':'disabled'}>Continue${pay.mode==='deposit'&&total?` · $${total}`:''}</button></div>`;
  const inner=`<div class="bk-top"><button ${S.step>1&&S.step<5?'data-back="1"':'data-go="page"'} aria-label="Back">${ico('i-back','width:15px;height:15px')}</button><b>${esc(d.short)}</b></div>
    <div class="steps" aria-label="Step ${S.step} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div>
    <div class="bk-wrap"><div class="bk-main"><div class="bk">${body}</div>${foot}</div>${S.step<5?`<aside class="bk-side"><b class="h">Your booking</b>
      <div class="r2"><span>${esc(it.n)}</span><span>${it.p}</span></div>
      <div class="r2"><span>When</span><span>${S.slot?`${DAYS[S.day][0]} ${DAYS[S.day][1]} Nov, ${S.slot}`:'Not chosen yet'}</span></div>
      ${extraOn()&&S.extra?`<div class="r2"><span>${esc(d.extra.t.split(' (')[0].replace('?',''))}</span><span>${esc(S.extra)}</span></div>`:''}
      <small>${esc(d.biz)} · ${esc(d.area)}</small></aside>`:''}</div>`;
  $('#v-book').innerHTML=`<div class="stage">
    <div class="stage-top"><div><h2>Booking flow · step ${S.step} of 5</h2><p>The same five steps for every industry, all in the browser. The rules in the middle change with the edition.</p></div>${devToggle()}</div>
    ${frame(inner,'/book')}
    <div class="notes">${noteList(d.rules,1)}${noteList([['Questions that matter here',`${d.qs.length} questions chosen for ${d.ind.toLowerCase()}. Answers are saved to the ${d.client}’s record.`],['Two kinds of consent','Reminders are part of the service. Updates and offers need a separate opt-in.'],['Waitlist, not a dead end','Full days offer the waitlist and fill gaps automatically.']],4)}</div></div>`;
}

}

      <div class="style-grid">
        <label>Colour</label><div class="sw">${Object.entries(BRANDS).map(([k,b])=>`<button data-brand="${k}" aria-pressed="${k===S.brand}"><i style="background:${b.b};border-color:${b.deep}"></i>${b.label}</button>`).join('')}</div>
        <label>Headings</label><div class="sw">${[['modern','Modern'],['classic','Classic serif']].map(([k,l])=>`<button class="tx" data-font="${k}" aria-pressed="${k===S.font}" style="font-family:${k==='classic'?'var(--f-serif)':'var(--f)'}">${l}</button>`).join('')}</div>
        <label>Corners</label><div class="sw">${[['round','Rounded'],['square','Square']].map(([k,l])=>`<button class="tx" data-corner="${k}" aria-pressed="${k===S.corner}" style="border-radius:${k==='square'?'5px':'999px'}">${l}</button>`).join('')}</div>
      </div>
      <p class="faint" style="font-size:13px;margin:14px 0 0">Open “Booking website” to see the change. The ${d.name} dashboard itself stays clean and white for every business.</p></div>
    <div class="card sstep"><div class="hd"><span class="n">4</span><h3>Connect your channels</h3></div>
      <div class="conn">
        <div class="c"><span class="ic" style="background:var(--wa)">${ico('i-wa')}</span><span><b>WhatsApp Business</b><small>${S.wa?'Connected':'Use your existing number'}</small></span>${S.wa?'<span class="pill ok">Connected</span>':'<button class="btn sm" data-conn="wa">Connect</button>'}</div>
        <div class="c"><span class="ic" style="background:#8A3FB8">${ico('i-ig')}</span><span><b>Instagram</b><small>${S.ig?'Link added to bio':'Adds your link to your profile'}</small></span>${S.ig?'<span class="pill ok">Connected</span>':'<button class="btn sm" data-conn="ig">Connect</button>'}</div>
      </div></div>
    <div class="card sstep live"><div><div class="hd"><span class="n">5</span><h3>Your page is live</h3></div><div class="url">${d.slug}</div><p>Share it in your bio, ads and messages, or connect your own domain.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn inv" data-copy="1">Copy link</button><button class="btn" data-go="page">Open page</button></div></div>
      <div class="qr" aria-hidden="true"><svg viewBox="0 0 21 21" shape-rendering="crispEdges" id="qr"></svg></div></div>
    <div class="plans">
      <div class="card plan"><span class="muted">Starter</span><br><b>Free</b><ul><li>Booking page</li><li>40 bookings a month</li><li>Email reminders</li></ul></div>
      <div class="card plan pr"><span class="muted">Pro</span><br><b>$29<span style="font-size:14px;font-weight:500">/mo</span></b><ul><li>Unlimited bookings and payments</li><li>WhatsApp inbox and follow-ups</li><li>Groups and campaigns</li></ul></div>
      <div class="card plan"><span class="muted">Team</span><br><b>$79<span style="font-size:14px;font-weight:500">/mo</span></b><ul><li>Everything in Pro</li><li>Up to 10 staff calendars</li><li>Roles and activity log</li></ul></div>
    </div></div>`;
  const g=$('#qr'); let h='',seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#18181B"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#18181B"/>`;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12); if(!f&&rnd()>.52) h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#18181B"/>`;}
  g.innerHTML=h+fin(0,0)+fin(14,0)+fin(0,14);
}

/* ============================== ROUTING & EVENTS ============================== */
const R={page:renderPage,book:renderBook,today:renderToday,inbox:renderInbox,clients:renderClients,auto:renderAuto,team:renderTeam,setup:renderSetup};
function show(v,scroll=true){
  if(!VIEWS.includes(v)) v='page'; S.view=v; R[v](); renderChrome();
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  const h=`${S.ed}-${v}`; if(location.hash.slice(1)!==h){ try{history.replaceState(null,'','#'+h);}catch(e){} }
  if(scroll) window.scrollTo(0,0);
}
const rerender=()=>{R[S.view](); renderChrome();};
function syncTheme(){$('#theme use').setAttribute('href',isDark()?'#i-sun':'#i-moon'); applyStyle();}
$('#theme').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark'; syncTheme();};
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m);}catch(e){toast('Copy didn’t work here. The link is '+t);}}

document.addEventListener('click',e=>{
  const T=x=>e.target.closest(x); let b; const d=D();
  if(b=T('[data-ed]')){ if(ti>=0) tourEnd(true); setEd(b.dataset.ed); toast(`${ED[b.dataset.ed].name}: the ${ED[b.dataset.ed].ind.toLowerCase()} edition.`); return; }
  if(b=T('#side [data-v]')){ show(b.dataset.v); return; }
  if(b=T('[data-dev]')){ S.dev=b.dataset.dev; rerender(); return; }
  if(b=T('[data-go]')){ S.step=1; show(b.dataset.go); return; }
  if(b=T('[data-wa]')){ toast(`Opens WhatsApp with a message started. The chat lands in the ${d.name} inbox.`); return; }
  if(b=T('[data-svc]')){ S.item=b.dataset.svc; S.step=2; S.slot=null; S.extra=null; show('book'); return; }
  if(b=T('[data-add]')){ toast(`${b.dataset.add} added.`); return; }
  if(b=T('[data-newc]')){ S.newc=b.dataset.newc==='1'; S.extra=null; rerender(); return; }
  if(b=T('[data-pick]')){ S.item=b.dataset.pick; S.extra=null; rerender(); return; }
  if(b=T('[data-day]')){ S.day=+b.dataset.day; S.slot=null; if(d.extra&&d.extra.opts==='patch'&&!patchOpts().includes(S.extra)) S.extra=null; rerender(); return; }
  if(b=T('[data-slot]')){ S.slot=b.dataset.slot; rerender(); return; }
  if(b=T('[data-extra]')){ S.extra=b.dataset.extra; rerender(); return; }
  if(b=T('[data-wait]')){ b.setAttribute('aria-checked','true'); toast('You’re on the waitlist. We’ll message you if a slot opens.'); return; }
  if(b=T('[data-q]')){ S.ans[b.dataset.q]=b.dataset.a; rerender(); return; }
  if(b=T('[data-c]')){ S.consent[b.dataset.c]=!S.consent[b.dataset.c]; b.setAttribute('aria-checked',S.consent[b.dataset.c]); return; }
  if(b=T('#bkNext')){ S.step++; rerender(); $('#scr').scrollTop=0; return; }
  if(b=T('[data-back]')){ S.step=Math.max(1,S.step-1); rerender(); return; }
  if(b=T('[data-pay]')){ S.step=5; rerender(); return; }
  if(b=T('[data-cal]')){ toast('Adds the booking to Apple or Google Calendar.'); return; }
  if(b=T('[data-restart]')){ S.step=1; S.slot=null; S.extra=null; rerender(); return; }
  if(b=T('[data-req]')){ const [i,j]=b.dataset.req.split(':').map(Number), m=d.reqs[i].a[j][2];
    if(m.startsWith('go:')){ S.seg=m.slice(3); show('clients'); return; } S.reqDone[i]=true; rerender(); toast(m); return; }
  if(b=T('[data-chat]')){ S.chat=+b.dataset.chat; rerender(); return; }
  if(b=T('[data-send]')){ S.sent[S.chat]=true; rerender(); toast(d.chats[S.chat].after); return; }
  if(b=T('[data-act]')){ const a=b.dataset.act; toast(a==='edit'?'Opens the reply so you can change it before sending.':a==='card'?'Opens their record: history, answers and consent.':'Books them in from the chat and sends the confirmation.'); return; }
  if(b=T('[data-seg]')){ S.seg=b.dataset.seg; rerender(); return; }
  if(b=T('[data-camp]')){ toast(b.dataset.camp==='send'?'Scheduled. Replies will land in the inbox.':'Creates an ad audience from opted-in people only. Numbers are hashed before upload.'); return; }
  if(b=T('[data-tg]')){ const n=b.dataset.tg; S.flowOn[n]=!S.flowOn[n]; S.flow=n; rerender(); toast(`${n} is ${S.flowOn[n]?'on':'off'}.`); return; }
  if(b=T('[data-flow]')){ S.flow=b.dataset.flow; rerender(); return; }
  if(b=T('[data-invite]')){ toast('Sends an invite by email. They choose a password and see only what their role allows.'); return; }
  if(b=T('[data-more]')){ toast(`${b.dataset.more}: the same engine with its own template, wording and rules.`); return; }
  if(b=T('[data-brand]')){ S.brand=b.dataset.brand; applyStyle(); rerender(); toast(`Booking page colour: ${BRANDS[S.brand].label}.`); return; }
  if(b=T('[data-font]')){ S.font=b.dataset.font; applyStyle(); rerender(); return; }
  if(b=T('[data-corner]')){ S.corner=b.dataset.corner; applyStyle(); rerender(); return; }
  if(b=T('[data-conn]')){ S[b.dataset.conn]=true; rerender(); toast(b.dataset.conn==='wa'?'WhatsApp Business connected.':'Instagram connected.'); return; }
  if(b=T('[data-copy]')){ copy('https://'+d.slug,'Link copied.'); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='campMsg') prevCamp(); });
document.addEventListener('change',e=>{ const s=e.target.closest('[data-role]'); if(s){ S.roles[s.dataset.role]=s.selectedIndex; toast(`${D().team[s.dataset.role][0]} is now ${s.value}. Their access changed straight away.`); } });
window.addEventListener('hashchange',()=>{ const [k,v]=location.hash.slice(1).split('-'); if(ED[k]&&k!==S.ed) setEd(k,true); show(v,false); });

/* ============================== WALKTHROUGH ============================== */
function tourSteps(){
  const d=D(), t=d.tour, it=ITEMS()[d.pick], booked=()=>{S.slot='11:30'; S.extra=d.extra.opts==='patch'?'Mon 9, 5pm':d.extra.opts[0]; S.consent={svc:true,mk:true};};
  const c1=`1 · A new ${d.client} books`, c2=`2 · ${d.owner}’s day`, c3='3 · They keep coming back', c4='4 · One platform, any business';
  return [
   {ch:c1,t:`${t.who} arrives from ${t.src}`,x:`The link opens ${d.biz}’s booking website in the browser. The offer, rating and next free time show before any scrolling.`,v:'page',f:'.offer'},
   {ch:c1,t:`${t.who} picks “${it.n}”`,x:'Everything bookable is listed with its details and price. Tapping one starts the booking with it already chosen.',v:'book',f:`.svc[data-pick="${d.pick}"]`,run(){S.step=1;}},
   {ch:c1,t:'A time, plus the rule for this industry',x:t.rule,v:'book',f:'.q',run(){S.step=2;booked();}},
   {ch:c1,t:'Details, questions and consent',x:`The questions are chosen for ${d.ind.toLowerCase()}. Ticking the second box is what allows follow-up offers later.`,v:'book',f:'.chk[data-c="mk"]',run(){S.step=3;booked();}},
   {ch:c1,t:t.pay[0],x:t.pay[1],v:'book',f:'.pay',run(){S.step=4;booked();}},
   {ch:c1,t:'Booked, with a WhatsApp confirmation',x:`${t.who} gets the details on WhatsApp within seconds. Nobody at ${d.biz} typed a word.`,v:'book',f:'.wa-prev',run(){S.step=5;booked();}},
   {ch:c2,t:`${d.owner} opens the dashboard`,x:'A clean white workspace, the same for every business. The numbers on top are the ones that matter in this industry.',v:'today',f:'.tiles'},
   {ch:c2,t:'Requests are matched to free slots',x:t.match,v:'today',f:'#r0'},
   {ch:c2,t:'A new enquiry on WhatsApp',x:'The reply is drafted from real prices and free times, with a booking link. One tap sends it, and the person is saved automatically.',v:'inbox',f:'.ai',run(){S.chat=0;}},
   {ch:c3,t:t.flowT,x:t.flowX,v:'auto',f:'.panel',run(){S.flow=d.keyFlow;}},
   {ch:c3,t:`${d.clients}, sorted into groups`,x:'Pick a group and send one WhatsApp message, or turn it into an ad audience. Only people who agreed to offers are included.',v:'clients',f:'.panel',run(){S.seg=d.segs[0][0];}},
   {ch:c4,t:'Roles control who sees what',x:t.role,v:'team',f:'.two > .card'},
   {ch:c4,t:'Each business styles its own page',x:'Colour, heading font and corner style are set in Setup. Here the page has just been switched to the Forest colour to show it.',v:'page',f:'.cp-hero',run(){S.brand='forest';applyStyle();}},
   {ch:c4,t:'Now switch industry',x:`This was ${d.name}, the ${d.ind.toLowerCase()} edition. Pick another industry at the top and the page, rules, wording and follow-ups all change.`,v:'page',hl:'#eds'}];
}
function focusOn(sel,hl){
  $$('.tfocus').forEach(e=>e.classList.remove('tfocus'));
  if(hl){ $(hl).classList.add('tfocus'); window.scrollTo(0,0); return; }
  const el=sel&&$(`#v-${S.view} ${sel}`); if(!el){ window.scrollTo(0,0); return; }
  el.classList.add('tfocus');
  const scr=el.closest('.scr'); if(scr) scr.scrollTop+=el.getBoundingClientRect().top-scr.getBoundingClientRect().top-110;
  const hdr=$('.hdr').getBoundingClientRect().bottom, tt=$('#tour').getBoundingClientRect().top, r=el.getBoundingClientRect();
  if(r.top<hdr+12||r.bottom>tt-12) window.scrollBy(0,r.top-hdr-70);
}
function tourGo(i){
  const steps=tourSteps(); ti=Math.max(0,Math.min(steps.length-1,i)); const st=steps[ti];
  resetDemo(); if(st.run) st.run();
  document.body.classList.add('touring'); $('#tour').hidden=false; show(st.v,true);
  $('#tCh').textContent=`${st.ch}  ·  ${ti+1} of ${steps.length}`; $('#tTitle').textContent=st.t; $('#tText').textContent=st.x;
  $('#tBar').style.width=((ti+1)/steps.length*100)+'%'; $('#tBack').disabled=ti===0; $('#tNext').textContent=ti===steps.length-1?'Explore freely':'Next';
  requestAnimationFrame(()=>focusOn(st.f,st.hl));
}
function tourEnd(quiet){ ti=-1; document.body.classList.remove('touring'); $('#tour').hidden=true; $$('.tfocus').forEach(e=>e.classList.remove('tfocus')); resetDemo(); if(!quiet) show('page'); }
$('#tourStart').onclick=()=>tourGo(0);
$('#tNext').onclick=()=>ti===tourSteps().length-1?tourEnd():tourGo(ti+1);
$('#tBack').onclick=()=>tourGo(ti-1);
$('#tExit').onclick=()=>tourEnd();
document.addEventListener('keydown',e=>{ if(ti<0||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight') $('#tNext').click(); else if(e.key==='ArrowLeft'&&ti>0) tourGo(ti-1); else if(e.key==='Escape') tourEnd(); });

/* boot */
(function(){ const [k,v]=location.hash.slice(1).split('-'); setEd(ED[k]?k:'glow',true); syncTheme();
  if(ED[k]&&VIEWS.includes(v)) show(v,false); else tourGo(0); })();
</script>
