<title>Glowbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header splits Client side (phone-framed page + booking) from Owner side (today, inbox, clients, automations, setup).
   Same system as Proof of Work: forest + lime, cream cards, chunky grotesk + italic serif, pills, bento, sparkles.
   The client page takes the studio's own brand colour (--b*), which Setup can change. */
:root{
  --page:#F4F2EA; --surface:#FFFFFF; --sunk:#ECEADF; --line:#E0DDD0; --line-2:#CDC9B8;
  --ink:#0C2418; --muted:#4D5E54; --faint:#7F8A82;
  --forest:#0A2B1C; --forest-2:#11392A; --forest-3:#1A4A35; --on-forest:#F1F5EC; --on-forest-2:#A8BFAF;
  --lime:#D6F53F; --lime-ink:#0A2B1C; --lime-soft:#F0FAC6;
  --green:#4FC864; --green-soft:#DCF3E0; --seal:#1B8F45;
  --warn:#C2410C; --warn-soft:#FCEBDD; --wa:#1FA855; --wa-bub:#DCF8C6; --wa-bg:#EFE9DF;
  --shadow:0 1px 2px rgba(10,43,28,.06),0 18px 50px rgba(10,43,28,.14);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-serif:"Instrument Serif",ui-serif,Georgia,serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --b:#D6F53F; --b-ink:#0A2B1C; --b-deep:#0A2B1C; --b-soft:#F0FAC6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#06150E; --surface:#0E2419; --sunk:#0A1C13; --line:#1D3828; --line-2:#2A4A37;
  --ink:#EAF2E6; --muted:#A3B8A9; --faint:#7A9183;
  --forest:#0C3121; --forest-2:#123E2B; --forest-3:#1B4D37;
  --lime-soft:#25300A; --green-soft:#0F3320; --seal:#5BD978; --warn:#F2A36B; --warn-soft:#2E1C10;
  --wa-bub:#1E4D33; --wa-bg:#0B1C14; --b-soft:#25300A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#06150E; --surface:#0E2419; --sunk:#0A1C13; --line:#1D3828; --line-2:#2A4A37;
  --ink:#EAF2E6; --muted:#A3B8A9; --faint:#7A9183;
  --forest:#0C3121; --forest-2:#123E2B; --forest-3:#1B4D37;
  --lime-soft:#25300A; --green-soft:#0F3320; --seal:#5BD978; --warn:#F2A36B; --warn-soft:#2E1C10;
  --wa-bub:#1E4D33; --wa-bg:#0B1C14; --b-soft:#25300A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--forest)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;margin:0;text-wrap:balance}
em.it{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid var(--line-2);background:var(--surface);white-space:nowrap;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.forest{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--seal)}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.wa{background:var(--green-soft);color:var(--wa)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--seal)}
.spark{fill:var(--lime);stroke:var(--forest);stroke-width:1.4}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.04em;white-space:nowrap;flex:none}
.logo .lm{width:24px;height:24px;border-radius:8px;background:var(--lime);display:grid;place-items:center}
.logo .lm svg{width:16px;height:16px;stroke:var(--forest);stroke-width:2.4}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px;font-family:var(--f-display)}
.tgl{width:42px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.tgl[aria-checked="true"]{background:var(--green)}
.tgl[aria-checked="true"]::after{transform:translateX(18px)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--forest);color:var(--on-forest);border-bottom:1px solid rgba(255,255,255,.08)}
.hdr .r{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.navs{display:flex;gap:10px;margin-left:auto;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:100%}
.grp{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07)}
.grp .gl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--on-forest-2);padding:0 8px 0 10px;white-space:nowrap}
.grp button{padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--on-forest-2);white-space:nowrap;position:relative}
.grp button[aria-current="page"]{background:var(--lime);color:var(--lime-ink)}
.grp button .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--lime);color:var(--forest);font-size:11px;margin-left:5px;padding:0 5px}
.grp button[aria-current="page"] .n{background:var(--forest);color:var(--lime)}
.theme{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--on-forest-2);flex:none;border:1px solid rgba(255,255,255,.15)}
.view{display:none}.view.on{display:block}
.vhead{padding-block:34px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vhead h1{font-size:clamp(32px,4.4vw,50px);letter-spacing:-.045em;line-height:1}
.vhead p{margin:8px 0 0;color:var(--muted);max-width:62ch}

/* ===== phone stage (client side) ===== */
.stage{display:grid;grid-template-columns:1fr 390px 1fr;gap:32px;align-items:start;padding-block:36px 72px}
.notes{display:flex;flex-direction:column;gap:14px;padding-top:40px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;position:relative}
.note b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px;letter-spacing:-.02em;margin-bottom:4px}
.note b i{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--forest);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.note p{margin:0;font-size:14px;color:var(--muted)}
.notes .intro h2{font-size:30px;letter-spacing:-.04em;line-height:1.02;margin-bottom:8px}
.notes .intro p{color:var(--muted);margin:0;font-size:15px}
.phone{width:390px;max-width:100%;height:800px;border-radius:46px;border:10px solid var(--forest);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone .sb{height:30px;flex:none;background:var(--b-deep);color:#F1F5EC;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.scr{flex:1;overflow:auto;position:relative;background:var(--page);scrollbar-width:thin}

/* client page */
.cp-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--b-deep);color:#F1F5EC;position:sticky;top:0;z-index:5}
.cp-top .nm{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:17px}
.cp-top .mk{width:28px;height:28px;border-radius:50%;background:var(--b);color:var(--b-ink);display:grid;place-items:center}
.cp-top .mk svg{width:18px;height:18px}
.cp-top .ics{display:flex;gap:6px}
.cp-top .ics span{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.cp-hero{background:radial-gradient(70% 60% at 80% 20%,color-mix(in srgb,var(--b) 30%,transparent),transparent 70%),var(--b-deep);color:#F1F5EC;padding:22px 18px 26px;position:relative;overflow:hidden}
.cp-hero .art{position:absolute;right:-26px;bottom:-8px;width:150px;height:90px;color:var(--b);opacity:.35}
.cp-hero .rt{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.cp-hero h1{font-size:38px;line-height:.98;letter-spacing:-.045em;margin:16px 0 10px;max-width:270px;color:#F1F5EC}
.cp-hero h1 em.it{color:var(--b)}
.cp-hero p{margin:0 0 18px;color:#C4D3C8;font-size:14.5px;max-width:280px}
.cp-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.bbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;background:var(--b);color:var(--b-ink)}
.wbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;font-weight:600;font-size:15px;background:var(--wa);color:#fff}
.cp-hero .next{margin-top:14px;font-size:13px;color:#C4D3C8;display:flex;align-items:center;gap:6px}
.cp-hero .next i{width:8px;height:8px;border-radius:50%;background:var(--b)}
.offer{margin:14px;padding:14px 16px;border-radius:18px;background:var(--b);color:var(--b-ink);display:flex;gap:12px;align-items:center}
.offer b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em;display:block;line-height:1.15}
.offer small{font-size:12.5px;opacity:.8}
.offer svg{width:34px;height:34px;flex:none}
.cp-sec{padding:16px}
.cp-sec h3{font-size:22px;letter-spacing:-.035em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.cp-sec h3 small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.sg{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:14px 0 6px}
.svc{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left}
.svc + .svc{margin-top:6px}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font-size:15px}
.svc .t small{color:var(--faint);font-size:12.5px}
.svc .p{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em}
.svc .go{width:30px;height:30px;border-radius:50%;background:var(--b-deep);color:var(--b);display:grid;place-items:center}
.svc[aria-pressed="true"]{border-color:var(--b-deep);box-shadow:inset 0 0 0 1.5px var(--b-deep);background:var(--b-soft)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gt{aspect-ratio:1/1;border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#F1F5EC;font-size:12.5px;font-weight:600}
.gt svg.l{position:absolute;inset:18% 10% auto;width:80%;color:currentColor;opacity:.95}
.gt span{position:relative;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:999px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.rv + .rv{margin-top:8px}
.rv q{display:block;font-family:var(--f-serif);font-size:19px;line-height:1.3;quotes:"“" "”"}
.rv small{display:block;color:var(--faint);font-size:12.5px;margin-top:6px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.prod .pi{height:84px;border-radius:12px;background:var(--b-soft);display:grid;place-items:center;color:var(--b-deep)}
.prod b{font-size:14px;line-height:1.25}
.prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.prod .row span{font-family:var(--f-display);font-weight:700}
.prod .row button{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--b-deep);color:var(--b)}
.know{display:flex;flex-direction:column;gap:8px}
.know div{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.know div b{display:block}
.know svg{color:var(--seal);margin-top:2px}
.cp-foot{background:var(--b-deep);color:#C4D3C8;padding:18px 16px 90px;font-size:13px;margin-top:10px}
.cp-foot b{color:#F1F5EC}
.sticky-bar{position:sticky;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 12px 14px;background:linear-gradient(transparent,var(--page) 30%)}
.sticky-bar .bbtn{flex:1;justify-content:center}
.sticky-bar .wbtn{padding:12px 14px}

/* booking */
.bk-top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--b-deep);color:#F1F5EC;position:sticky;top:0;z-index:5}
.bk-top button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#F1F5EC}
.bk-top b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em}
.steps{display:flex;gap:4px;padding:12px 16px 0}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--b-deep)}
.bk{padding:16px;display:flex;flex-direction:column;gap:12px}
.bk h2{font-size:26px;letter-spacing:-.04em;line-height:1.05}
.bk .sub{color:var(--muted);font-size:14px;margin:-4px 0 4px}
.seg2{display:flex;padding:4px;border-radius:999px;background:var(--sunk);gap:2px}
.seg2 button{flex:1;padding:8px 10px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day{min-width:56px;padding:9px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);line-height:1.1}
.day[aria-pressed="true"]{background:var(--b-deep);border-color:var(--b-deep);color:#C4D3C8}
.day[aria-pressed="true"] b{color:var(--b)}
.day:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slot:disabled{text-decoration:line-through;color:var(--faint);background:var(--sunk)}
.slot[aria-pressed="true"]{background:var(--b);border-color:var(--b-deep);color:var(--b-ink)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input{padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.fld input:focus{outline:none;border-color:var(--b-deep)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.q b{display:block;margin-bottom:8px;font-weight:600}
.q .opts{display:flex;gap:6px;flex-wrap:wrap}
.q .opts button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600}
.q .opts button[aria-pressed="true"]{background:var(--b-deep);color:var(--b);border-color:var(--b-deep)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:14px;background:var(--sunk);text-align:left;width:100%}
.chk .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;background:var(--surface);margin-top:1px}
.chk[aria-checked="true"] .bx{background:var(--b-deep);border-color:var(--b-deep);color:var(--b)}
.chk .bx svg{width:14px;height:14px;stroke-width:3;opacity:0}
.chk[aria-checked="true"] .bx svg{opacity:1}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.sum .r2{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.sum .r2.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
.pay{display:flex;flex-direction:column;gap:8px}
.pay button{padding:13px;border-radius:14px;font-weight:700;font-size:15px}
.pay .p1{background:var(--ink);color:var(--page)}
.pay .p2{border:1.5px solid var(--line-2);background:var(--surface)}
.bk-foot{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,var(--page) 25%)}
.bk-foot .bbtn{width:100%;justify-content:center}
.bk-foot .bbtn:disabled{opacity:.45;cursor:default}
.done{text-align:center;padding:26px 16px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--b);color:var(--b-ink);display:grid;place-items:center;margin:0 auto 14px;box-shadow:4px 4px 0 var(--b-deep)}
.done .ok svg{width:34px;height:34px;stroke-width:3}
.wa-prev{background:var(--wa-bg);border-radius:18px;padding:12px;text-align:left;margin-top:14px}
.wa-prev .h{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wa-msg{background:var(--wa-bub);border-radius:12px 12px 12px 4px;padding:9px 11px;font-size:13.5px;line-height:1.45;white-space:pre-line}
.wa-msg small{display:block;text-align:right;font-size:11px;color:var(--faint)}

/* ===== owner side ===== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tile{padding:18px 20px;border-radius:24px}
.tile span{font-size:13.5px;color:var(--muted)}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.05em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{font-size:12.5px;color:var(--faint)}
.tile.fo{background:var(--forest);color:var(--on-forest)} .tile.fo span,.tile.fo small{color:var(--on-forest-2)} .tile.fo b{color:var(--lime)}
.tile.li{background:var(--lime);color:var(--lime-ink)} .tile.li span,.tile.li small{color:var(--lime-ink);opacity:.75}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start;padding-bottom:64px}

.thread{display:flex;flex-direction:column;min-width:0}

.m.sys{align-self:center;background:var(--surface);font-size:12.5px;color:var(--muted);border-radius:999px;padding:5px 12px}

.ai .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--seal);margin-bottom:6px}

.live{background:var(--forest);color:var(--on-forest);border:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}

.live p{color:var(--on-forest-2);margin:8px 0 14px;font-size:14.5px}
.qr{width:120px;height:120px;border-radius:16px;background:var(--surface);padding:10px}
.qr svg{width:100%;height:100%}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.plan{padding:20px;border-radius:22px}
.plan b{font-family:var(--f-display);font-size:30px;letter-spacing:-.04em}
.plan ul{margin:10px 0 0;padding-left:18px;font-size:14px}
.plan.fr{background:var(--surface);border:1px solid var(--line)}
.plan.pr{background:var(--lime);color:var(--lime-ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--forest);color:var(--on-forest);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center;border:1.5px solid var(--lime)}

  .camp,.prev{position:static}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .types{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){

  .grp .gl{display:none}
  .navs{order:3;width:100%;margin-left:0}
  .theme{margin-left:auto}
}

}

function drawQR(){ // decorative QR-style pattern, not a scannable code
  const g=$('#qr'); if(!g) return; let h=''; let seed=7;
  const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0A2B1C"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0A2B1C"/>`;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){ const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12); if(!inF&&rnd()>.52) h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0A2B1C"/>`; }
  g.innerHTML=h+finder(0,0)+finder(14,0)+finder(0,14);
}

/* ============================== ROUTING & EVENTS ============================== */
const VIEWS=['page','book','today','inbox','clients','auto','setup'];
const R={page:renderPage,book:renderBook,today:renderToday,inbox:renderInbox,clients:renderClients,auto:renderAuto,setup:renderSetup};
function show(v,scroll=true){
  if(!VIEWS.includes(v)) v='page'; S.view=v; R[v]();
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  $$('#navs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===v)); $$('#navs button').forEach(b=>{ if(b.dataset.v===v) b.setAttribute('aria-current','page'); });
  if(location.hash.slice(1)!==v){ try{ history.replaceState(null,'','#'+v); }catch(e){} }
  if(scroll) window.scrollTo(0,0);
}
function rerender(){ R[S.view](); }
$('#navs').addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b) show(b.dataset.v);});
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
function isDark(){const t=document.documentElement.dataset.theme; return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function syncTheme(){$('#theme use').setAttribute('href',isDark()?'#i-sun':'#i-moon');}
$('#theme').onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark'; syncTheme();};
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m);}catch(e){toast('Copy didn’t work here. The link is '+t);}}

document.addEventListener('click',e=>{
  const T=x=>e.target.closest(x);
  let b;
  if(b=T('[data-go]')){ S.step=1; show(b.dataset.go); return; }
  if(b=T('[data-wa]')){ toast('Opens WhatsApp with “Hi Nia, I’d like to book…” typed in. The chat lands in the Glowbook inbox.'); return; }
  if(b=T('[data-svc]')){ S.svc=b.dataset.svc; S.step=2; S.slot=null; show('book'); return; }
  if(b=T('[data-add]')){ toast(`${b.dataset.add} added. Collect it at your appointment.`); return; }
  // booking
  if(b=T('[data-newc]')){ S.newc=b.dataset.newc==='1'; rerender(); return; }
  if(b=T('[data-pick]')){ S.svc=b.dataset.pick; rerender(); return; }
  if(b=T('[data-day]')){ S.day=+b.dataset.day; S.slot=null; if(!patchOpts().includes(S.patchDay)) S.patchDay=null; rerender(); return; }
  if(b=T('[data-slot]')){ S.slot=b.dataset.slot; rerender(); return; }
  if(b=T('[data-patch]')){ S.patchDay=b.dataset.patch; rerender(); return; }
  if(b=T('[data-wait]')){ toast('You’re on the waitlist. We’ll message you on WhatsApp if a slot opens.'); b.setAttribute('aria-checked','true'); return; }
  if(b=T('[data-q]')){ S.ans[b.dataset.q]=b.dataset.a; rerender(); return; }
  if(b=T('[data-c]')){ S.consent[b.dataset.c]=!S.consent[b.dataset.c]; b.setAttribute('aria-checked',S.consent[b.dataset.c]); return; }
  if(b=T('[data-addkit]')){ const on=b.getAttribute('aria-checked')!=='true'; b.setAttribute('aria-checked',on); toast(on?'Aftercare kit added: $28, paid on the day.':'Kit removed.'); return; }
  if(b=T('#bkNext')){ if(S.step===2 && !S.slot) return; S.step++; rerender(); $('#scr').scrollTop=0; return; }
  if(b=T('[data-back]')){ S.step=Math.max(1,S.step-1); rerender(); return; }
  if(b=T('[data-pay]')){ S.step=5; rerender(); return; }
  if(b=T('[data-cal]')){ toast('Adds the appointment to Apple or Google Calendar.'); return; }
  if(b=T('[data-restart]')){ S.step=1; S.slot=null; S.patchDay=null; rerender(); return; }
  // today
  if(b=T('[data-req]')){ const [id,i]=b.dataset.req.split(':'); const r=REQS.find(x=>x.id===id), m=r.a[+i][2];
    if(m.startsWith('go:')){ const [,v,seg]=m.split(':'); S.seg=seg; show(v); return; }
    S.reqDone[id]=true; if(S.view==='today') rerender(); toast(m); return; }
  // inbox
  if(b=T('[data-chat]')){ S.chat=+b.dataset.chat; rerender(); return; }
  if(b=T('[data-send]')){ S.sent[S.chat]=true; const left=CHATS.length-Object.keys(S.sent).length; $('#inN').textContent=left; $('#inN').hidden=!left; rerender(); toast(CHATS[S.chat].after); return; }
  if(b=T('[data-act]')){ const a=b.dataset.act; toast(a==='edit'?'Opens the reply so you can change it before sending.':a==='client'?'Opens her client card: visits, lash style, allergies and consent.':'Books her in from the chat and sends the confirmation.'); return; }
  // clients
  if(b=T('[data-seg]')){ S.seg=b.dataset.seg; rerender(); return; }
  if(b=T('[data-var]')){ const t=$('#campMsg'); t.value+=' '+b.dataset.var; prevCamp(); return; }
  if(b=T('[data-camp]')){ toast(b.dataset.camp==='send'?'Scheduled. Messages go out over the next 10 minutes, and replies land in your inbox.':'Creates a Meta ad audience from opted-in clients only. Numbers are hashed before upload.'); return; }
  // automations
  if(b=T('[data-tg]')){ e.stopPropagation(); const n=b.dataset.tg; S.flowOn[n]=!S.flowOn[n]; S.flow=n; rerender(); toast(`${n} is ${S.flowOn[n]?'on':'off'}.`); return; }
  if(b=T('[data-flow]')){ S.flow=b.dataset.flow; rerender(); return; }
  // setup
  if(b=T('[data-type]')){ S.biz=b.dataset.type; rerender(); return; }
  if(b=T('[data-brand]')){ S.brand=b.dataset.brand; applyBrand(); rerender(); toast(`Studio page colour set to ${BRANDS[S.brand].label}.`); return; }
  if(b=T('[data-conn]')){ S[b.dataset.conn]=true; rerender(); toast(b.dataset.conn==='wa'?'WhatsApp Business connected. Messages now come into your inbox.':'Instagram connected. A Book button now shows on your profile.'); return; }
  if(b=T('[data-copy]')){ copy('https://lunalash.glowbook.app','Link copied.'); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='campMsg') prevCamp(); });

applyBrand(); syncTheme(); show(location.hash.slice(1)||'page',false);
</script>
