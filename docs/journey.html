<title>Wanlly Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: storyboard. A screen list on the left, one screen at a time in a frame, notes under it. Brand tokens from the Wanlly design system. */
:root{
  --paper:#fbfbfc; --surface:#ffffff; --side:#f3f4f7; --hover:#e9ebf0; --line:#e3e5eb; --code:#f4f5f8;
  --ink:#15171c; --muted:#636a78; --faint:#9aa0ac;
  --tang:#ff5a1f; --tang-text:#c2410c; --tang-soft:#ffeee6; --tang-line:#ffd2bf;
  --good:#11955a; --bad:#e5484d; --shadow:0 1px 2px rgba(20,24,35,.04),0 8px 24px rgba(20,24,35,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111216; --surface:#17181d; --side:#0c0d10; --hover:#1f2127; --line:#272930; --code:#0e0f13;
  --ink:#ecedf1; --muted:#979daa; --faint:#686e7a; --tang:#ff6a33; --tang-text:#ff8a5c; --tang-soft:#2c160d; --tang-line:#5a2a16;
  --good:#3ccb85; --bad:#ff6b6f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111216; --surface:#17181d; --side:#0c0d10; --hover:#1f2127; --line:#272930; --code:#0e0f13;
  --ink:#ecedf1; --muted:#979daa; --faint:#686e7a; --tang:#ff6a33; --tang-text:#ff8a5c; --tang-soft:#2c160d; --tang-line:#5a2a16;
  --good:#3ccb85; --bad:#ff6b6f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--side);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tang);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
p{margin:0}

.board{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.list{border-right:1px solid var(--line);overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
.list .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
.list .brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.list .brand small{display:block;color:var(--faint);font-size:12px;font-weight:400}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 8px 4px;font-weight:500}
.list button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:6px 8px;border-radius:8px;font-size:14px;color:var(--muted)}
.list button span{font-family:var(--f-mono);font-size:11px;color:var(--faint);min-width:20px}
.list button:hover{background:var(--hover);color:var(--ink)}
.list button[aria-current="true"]{background:var(--hover);color:var(--ink);font-weight:500}
.mobile-nav{display:none}

.stage{overflow:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px;min-width:0}
.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topline h1{font-size:22px}
.topline .crumb{font-size:13px;color:var(--faint)}
.topline .nav{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.tang{background:var(--tang);color:#15171c}
.btn.pill{border-radius:999px}
.frame{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);min-height:560px;display:flex;flex-direction:column;container-type:inline-size}
.chrome{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--hover)}
.chrome span{margin-left:10px;font-family:var(--f-mono);font-size:12px;color:var(--faint);background:var(--side);padding:2px 10px;border-radius:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{flex:1;display:flex;flex-direction:column;min-width:0}
.notes{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--muted)}
.note b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}

/* Shared in-screen pieces */
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--f-mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.chip.tang{background:var(--tang-soft);color:var(--tang-text)}
.chip.soon{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:400}
.mark{display:inline-block;vertical-align:middle}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}

/* App shell inside screens */
.app{display:grid;grid-template-columns:210px minmax(0,1fr);flex:1;min-height:520px}
.app aside{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.app aside .it{padding:6px 8px;border-radius:8px;color:var(--muted);display:flex;gap:8px;align-items:center}
.app aside .it.on{background:var(--hover);color:var(--ink);font-weight:500}
.app aside .meter{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.bar{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tang);border-radius:99px}
.app main{display:flex;flex-direction:column;min-width:0}
.apptop{display:flex;align-items:center;gap:8px;padding:10px 16px}
.picker{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--hover)}
.credits{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
.work{flex:1;padding:12px 20px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.bubble{align-self:flex-end;max-width:80%;background:var(--hover);padding:9px 14px;border-radius:16px 16px 6px 16px}
.composer{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.composer .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--hover);border-radius:10px;font-size:12.5px}
.seg span{padding:4px 9px;border-radius:8px;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--ink);font-weight:500}
.send{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.sponsor{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sponsor .b{display:flex;gap:10px;padding:12px}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.sponsor .a{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.rec{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--tang-soft);border:1px solid var(--tang-line);font-size:13.5px}

/* Marketing pages */
.mkt{display:flex;flex-direction:column}
.mnav{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line)}
.mnav b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em}
.hero{padding:56px 24px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.hero h1{font-size:clamp(34px,6cqi,64px);line-height:1;letter-spacing:-.04em;max-width:15ch}
.hero p{max-width:54ch;font-size:16.5px;color:var(--muted)}
.band{padding:28px 24px;border-top:1px solid var(--line)}
.center{max-width:880px;margin:0 auto;width:100%}

@media (max-width:860px){
  .board{grid-template-columns:minmax(0,1fr)}
  .list{display:none}
  .mobile-nav{display:block}
  .stage{padding:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  .app aside{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="board">
  <nav class="list" id="list" aria-label="Screens"></nav>
  <div class="stage">
    <div class="mobile-nav"><label class="field" for="jump">Screen<select id="jump"></select></label></div>
    <div class="topline">
      <div><span class="crumb" id="crumb"></span><h1 id="title"></h1></div>
      <div class="nav"><button class="btn ghost" id="prev">← Back</button><button class="btn dark" id="next">Next →</button></div>
    </div>
    <div class="frame"><div class="chrome"><i></i><i></i><i></i><span id="url"></span></div><div class="screen" id="screen"></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script>
const MARK=(s=24)=>`<svg class="mark" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><defs><mask id="m${s}" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="26" r="8.8" fill="#000"/></mask></defs><rect width="64" height="64" rx="16" fill="var(--ink)"/><path d="M11 21 L21 44 L32 26 L43 44 L53 21" mask="url(#m${s})" fill="none" stroke="var(--paper)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="26" r="6.2" fill="var(--tang)"/></svg>`;
const NAV=(cta="Request early access")=>`<div class="mnav">${MARK(26)}<b>wanlly</b><span style="margin-left:auto" class="muted" >How it works</span><span class="muted" style="margin:0 12px">Models</span><span class="btn dark pill">${cta}</span></div>`;
const SIDE=(on)=>`<aside><div style="display:flex;gap:8px;align-items:center;padding:4px 6px 10px">${MARK(22)}<b style="font-family:var(--f-display)">Wanlly</b></div>
${[["New chat"],["Templates"],["Projects"],["Connections"],["Credits"],["Settings"]].map(([t])=>`<div class="it ${t===on?"on":""}">${t}</div>`).join("")}
<div class="eyebrow" style="padding:12px 8px 2px">Recent</div><div class="it">Salon booking page</div><div class="it">Study planner</div>
<div class="meter"><div style="display:flex;justify-content:space-between"><span class="muted">This window</span><b class="mono">62%</b></div><div class="bar"><i style="width:62%"></i></div><span class="faint">Resets in 2h 14m</span></div></aside>`;
const TOP=(model="Haiku 5.5",cr="1 cr",credits="18")=>`<div class="apptop"><span class="picker">${model} <span class="chip">${cr}</span> ▾</span><span class="credits">⚡ ${credits} credits</span></div>`;
const COMPOSER=(tool="Chat",ph="Describe what you want to make")=>`<div class="composer"><div class="faint">${ph}</div><div class="row">📎<div class="seg">${["Chat","Code","Design","Images","Video"].map(t=>`<span class="${t===tool?"on":""}">${t}${t==="Images"||t==="Video"?" ·soon":""}</span>`).join("")}</div><span class="send">↑</span></div></div>`;
const APP=(on,inner,top=TOP())=>`<div class="app">${SIDE(on)}<main>${top}<div class="work">${inner}</div></main></div>`;

const S=[];
const add=(group,id,title,url,html,notes)=>S.push({group,id,title,url,html,notes});

/* ---------- Discover ---------- */
add("Discover","landing","Landing page","wanlly.com",
`<div class="mkt">${NAV()}
<section class="hero"><span class="chip">Early access · new invites every week</span>
<h1>More ideas than money? Perfect.</h1>
<p>Wanlly puts the world's most capable AI in your hands to write, code and design whatever you've been dreaming up. A short video now and then is the whole price.</p>
<span class="btn dark pill" style="padding:12px 22px">Request early access</span>
<span class="faint" style="font-size:13px">Starting with Claude by Anthropic. ChatGPT, Gemini and more coming soon.</span></section>
<section class="band"><div class="center grid g3">
${[["Build the thing you keep thinking about","Describe your app, your shop page, your side project. Watch it take shape in minutes."],["The same AI the pros use","Haiku for quick answers, Sonnet for real builds, Opus for the hard parts. We help you pick."],["Your wallet stays in your pocket","Brands pay to meet ambitious people. You give them twenty seconds. They give you AI time."]].map(([h,p])=>`<div class="card"><h3 style="font-size:18px">${h}</h3><p class="muted">${p}</p></div>`).join("")}
</div></section>
<section class="band"><div class="center" style="display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center"><span class="eyebrow">What will you build?</span>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${["A booking page for my cousin's salon","An invoice app for my shop","A study planner for exams","A portfolio that gets me hired","A price tracker for farmers"].map(t=>`<span class="chip" style="font-size:13px;padding:6px 12px">${t}</span>`).join("")}</div></div></section></div>`,
[["Job of this page","Make one feeling land: I could actually build my idea. Then one action: request access."],["Copy approach","Leads with the reader's situation (ideas, no money), turns it into an advantage, and makes the price concrete: a short video."],["Proof","No fake testimonials before launch. Real builds go here as soon as the first group ships something."]]);

add("Discover","how","How it works and why it's free","wanlly.com/#how",
`<div class="mkt">${NAV()}
<section class="band" style="border-top:0"><div class="center grid g3">
${[["1","Tell us your idea","One minute. We read every application."],["2","Get your invite","We open the doors to a new group every week. Friends you invite move you up the line."],["3","Watch, then build","A twenty-second video earns AI time. Spend it on Haiku, Sonnet or Opus."]].map(([n,h,p])=>`<div class="card"><span class="mono" style="color:var(--tang-text)">${n}</span><h3 style="font-size:19px">${h}</h3><p class="muted">${p}</p></div>`).join("")}
</div></section>
<section class="band"><div class="center grid g2" style="align-items:center">
<div style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:32px;line-height:1.1">Why is it free? Because you're worth meeting.</h2>
<p class="muted">Brands want to reach curious, ambitious builders. When you choose to watch their twenty-second video, they pay, and most of that money becomes your AI time. Part of every ad also goes into a community pool, so a student in Lagos starts each day with the same floor as one in Boston. Ads sit beside your work. Never inside an answer, and never in the way.</p></div>
<div class="grid g2">${[["20 s","a video, when you choose"],["1 floor","the same daily minimum for everyone, everywhere"],["0","cards, subscriptions or hidden fees"],["4","Claude models today, more on the way"]].map(([n,l])=>`<div class="card"><span style="font-family:var(--f-display);font-size:30px;font-weight:600">${n}</span><span class="muted" style="font-size:13px">${l}</span></div>`).join("")}</div>
</div></section>
<section class="band"><div class="center" style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Models</span>
<div class="grid g3">${[["Claude Haiku 5.5","Anthropic","Live"],["Claude Sonnet 5.5","Anthropic","Live"],["Claude Opus 5.5","Anthropic","Live"],["Claude Fable 5.1","Anthropic","Live"],["ChatGPT","OpenAI","Coming soon"],["Gemini","Google","Coming soon"],["Image and video models","Several providers","Coming soon"]].map(([n,p,s])=>`<div class="card" style="flex-direction:row;align-items:center"><div style="flex:1"><b>${n}</b><div class="faint" style="font-size:12.5px">${p}</div></div><span class="chip ${s==="Live"?"good":"soon"}">${s}</span></div>`).join("")}</div></div></section></div>`,
[["The honesty section","Answers the question everyone has before they have to ask. Framed around the reader's value, not our business model."],["Multi-model promise","Claude is live at launch. Everything else is labelled Coming soon, never implied to work today."]]);

add("Discover","apply","Request early access","wanlly.com/#apply",
`<div class="mkt">${NAV()}<section class="band" style="border-top:0"><div class="center" style="max-width:520px;display:flex;flex-direction:column;gap:12px">
<h2 style="font-size:32px;text-align:center">Tell us what you'd build.</h2><p class="muted" style="text-align:center">We read every one. The more real your idea, the sooner you're in.</p>
${[["Your name","Amina Wanjiru"],["Email","amina@email.com"]].map(([l,v])=>`<label class="field">${l}<input value="${v}"></label>`).join("")}
<label class="field">Country<select><option>Kenya</option></select></label>
<label class="field">What do you want to build?<textarea rows="3">A booking app for my cousin's salon, with M-Pesa reminders.</textarea></label>
<label class="field">Where did you hear about us?<select><option>A friend invited me</option></select></label>
<label class="field">Invite code (optional)<input value="kevin-7f3a"></label>
<label style="display:flex;gap:8px;font-size:13px" class="muted"><input type="checkbox" checked> I'm 18 or older and agree to the Terms and Privacy Policy.</label>
<span class="btn dark pill" style="padding:12px">Request my invite</span></div></section></div>`,
[["Friction on purpose","Six fields. The 'what will you build' answer is how you pick builders over freeloaders, and it doubles as your best marketing research."],["Legal","Age confirmation and links to Terms and Privacy at the point of collecting data. Marketing emails are a separate, unticked opt-in (shown on the next screen)."]]);

add("Discover","applied","You're in line","wanlly.com/beta/thanks",
`<div class="mkt">${NAV()}<section class="hero"><span class="chip good">✓ Request received</span><h1 style="font-size:44px">You're in line, Amina.</h1>
<p>We open the doors to a new group every Monday. Want in sooner? Every friend who applies with your link moves you up.</p>
<div class="card" style="flex-direction:row;align-items:center;max-width:460px;width:100%"><span class="mono" style="flex:1;text-align:left">wanlly.com/i/amina-4k2p</span><span class="btn dark">Copy link</span></div>
<div style="display:flex;gap:8px">${["WhatsApp","X","LinkedIn","Copy"].map(t=>`<span class="btn ghost">${t}</span>`).join("")}</div>
<label style="display:flex;gap:8px;font-size:13px" class="muted"><input type="checkbox"> Send me build tips and launch news (optional)</label>
<p class="faint" style="font-size:13px">Your place: <b class="mono">#412</b> · 3 friends would put you in the next group.</p></section></div>`,
[["Momentum","The moment of highest excitement. Turn it into sharing with one-tap WhatsApp."],["Consent","Marketing emails are opt-in and unticked. Transactional emails (your invite) don't need consent."]]);

/* ---------- Get started ---------- */
add("Get started","invite","Invite email","Email · inbox",
`<div style="padding:28px;display:flex;justify-content:center"><div class="card" style="max-width:560px;width:100%;gap:14px;padding:24px">
<div style="display:flex;gap:10px;align-items:center">${MARK(28)}<b>Wanlly</b><span class="faint" style="margin-left:auto;font-size:12px">Monday 9:00</span></div>
<h2 style="font-size:26px">Amina, your invite is here.</h2>
<p class="muted">The idea you told us about, a booking app for your cousin's salon, is exactly why we built Wanlly. Watch one 20-second video and today's floor is yours. That's enough to have Claude sketch the whole thing tonight.</p>
<span class="btn dark pill" style="align-self:flex-start;padding:11px 20px">Start building</span>
<p class="faint" style="font-size:12.5px">This invite is for you and expires in 7 days. You're getting this because you requested early access at wanlly.com.</p></div></div>`,
[["Personal","Quotes their own idea back to them. Feels like a person wrote it because a person's words are in it."],["No free credits","There is no welcome grant. The first video unlocks the first day, so every credit is paid for by an ad."]]);

add("Get started","signin","Sign in","wanlly.com/sign-in",
`<div style="flex:1;display:grid;place-items:center;padding:30px"><div class="card" style="max-width:400px;width:100%;gap:12px;padding:24px;text-align:center">

/* ---------- Render ---------- */
let cur=0;
const list=document.getElementById("list"), jump=document.getElementById("jump");
function buildNav(){
  let h=`<div class="brand">${MARK(28)}<div><b>Wanlly journey</b><small>${S.length} screens, click through</small></div></div>`, g="";
  let o="";
  S.forEach((s,i)=>{if(s.group!==g){g=s.group;h+=`<div class="group">${g}</div>`;o+=`<optgroup label="${g}">`}
    h+=`<button data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${s.title}</button>`;o+=`<option value="${i}">${i+1}. ${s.title}</option>`});
  list.innerHTML=h; jump.innerHTML=o;
}
function show(i){
  cur=Math.max(0,Math.min(S.length-1,i)); const s=S[cur];
  document.getElementById("screen").innerHTML=s.html;
  document.getElementById("title").textContent=s.title;
  document.getElementById("crumb").textContent=`${s.group} · ${cur+1} of ${S.length}`;
  document.getElementById("url").textContent=s.url;
  document.getElementById("notes").innerHTML=s.notes.map(([t,d])=>`<div class="note"><b>${t}</b>${d}</div>`).join("");
  list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",+b.dataset.i===cur));
  jump.value=cur; document.querySelector(".stage").scrollTop=0;
  try{history.replaceState(null,"","#"+s.id)}catch(e){}
}
buildNav();
list.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i)});
jump.addEventListener("change",e=>show(+e.target.value));
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur+1);
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select"))return;if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});
const start=S.findIndex(s=>s.id===location.hash.slice(1));
show(start>=0?start:0);
</script>
