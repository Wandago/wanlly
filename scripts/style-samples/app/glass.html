<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0}
:root{--bg:#0c1030;--page:#0c1030;--surface:rgba(255,255,255,.12);--ink:#ffffff;--text:rgba(255,255,255,.85);--muted:rgba(255,255,255,.6);--line:rgba(255,255,255,.22);--accent:#ffffff;--accent2:#00b8ff;--on:#0c1030;--r:22px;--d:Manrope,sans-serif;--b:Manrope,sans-serif;--dw:800;--tr:-0.04em}
body{width:1440px;height:1080px;overflow:hidden;background:var(--page);font-family:var(--b);color:var(--text);position:relative}
.disp{font-family:var(--d);font-weight:var(--dw);letter-spacing:var(--tr);color:var(--ink);line-height:.98}
.it{font-style:normal;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on);font-weight:600;border-radius:22px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);backdrop-filter:blur(18px);}
.pattern{background:repeating-linear-gradient(90deg,var(--accent) 0 24px,var(--accent2) 24px 48px,var(--ink) 48px 72px)}
.blob{position:absolute;border-radius:50%;filter:blur(80px)}
body{display:flex;align-items:center;justify-content:center;gap:56px}
.ph{position:relative;width:380px;height:800px;border-radius:56px;background:#000;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.25)}
.ph:nth-child(even){transform:translateY(40px)}
.sc{height:100%;border-radius:44px;background:var(--bg);padding:20px 22px 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.st{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:16px}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hero small{color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:calc(var(--r) * .8);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px}
.li i{width:34px;height:34px;border-radius:10px;background:var(--accent2);opacity:.85;flex:none}
.li em{margin-left:auto;font-style:normal;color:var(--muted);font-size:14px}
.nav{margin-top:auto;display:flex;justify-content:space-between;padding:16px 8px 26px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
