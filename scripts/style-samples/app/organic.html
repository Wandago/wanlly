<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0}
:root{--bg:#f4efe3;--page:#c9d8b6;--surface:#fffaf0;--ink:#2d3b2a;--text:#3d4a39;--muted:#6b7867;--line:#e2dccb;--accent:#3e5a2e;--accent2:#b5653a;--on:#fff;--r:24px;--d:Fraunces,serif;--b:'Nunito Sans',sans-serif;--dw:600;--tr:-0.03em}
body{width:1440px;height:1080px;overflow:hidden;background:var(--page);font-family:var(--b);color:var(--text);position:relative}
.disp{font-family:var(--d);font-weight:var(--dw);letter-spacing:var(--tr);color:var(--ink);line-height:.98}
.it{font-style:italic;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on);font-weight:600;border-radius:24px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);}
.pattern{background:repeating-linear-gradient(90deg,var(--accent) 0 24px,var(--accent2) 24px 48px,var(--ink) 48px 72px)}

body{display:flex;align-items:center;justify-content:center;gap:56px}
.ph{position:relative;width:380px;height:800px;border-radius:56px;background:#111;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.25)}
.ph:nth-child(even){transform:translateY(40px)}
.sc{height:100%;border-radius:44px;background:var(--bg);padding:20px 22px 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.st{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:16px}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hero small{color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:calc(var(--r) * .8);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px}
.li i{width:34px;height:34px;border-radius:10px;background:var(--accent2);opacity:.85;flex:none}
.li em{margin-left:auto;font-style:normal;color:var(--muted);font-size:14px}
.nav{margin-top:auto;display:flex;justify-content:space-between;padding:16px 8px 26px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style></head><body>
<div class="ph"><div class="sc"><div class="st"><span>9:41</span><span>● ● ●</span></div><p class="k">Shamba Fresh</p><h1 class="disp" style="font-size:44px;margin:6px 0 18px">This week’s box</h1>
<div class="card hero" style=""><small>Family box</small><b class="disp" style="font-size:36px">KES 1,200</b><span class="btn" style="padding:12px 18px;margin-top:14px">Confirm box</span></div>
<div class="list"><div class="li"><i></i><span>Sukuma wiki</span><em>2 bunches</em></div><div class="li"><i></i><span>Tomatoes</span><em>1 kg</em></div><div class="li"><i></i><span>Avocados</span><em>4 pcs</em></div></div><div class="nav"><span style="color:var(--accent);font-weight:700">Box</span><span style="">Farms</span><span style="">Recipes</span><span style="">Me</span></div></div></div><div class="ph"><div class="sc"><div class="st"><span>9:41</span><span>● ● ●</span></div><p class="k">Details</p><h1 class="disp" style="font-size:36px;margin:6px 0 16px">Sukuma wiki</h1>
<div class="card" style="height:250px;display:grid;place-items:center"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="75" cy="75" r="60" fill="none" stroke="var(--accent)" stroke-width="16" stroke-dasharray="377" stroke-dashoffset="110" stroke-linecap="round" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)" font-family="Fraunces,serif">71%</text></svg></div>
<div class="list" style="margin-top:16px"><div class="li"><i></i><span>Tomatoes</span><em>1 kg</em></div><div class="li"><i></i><span>Avocados</span><em>4 pcs</em></div></div><span class="btn" style="width:100%;padding:16px;margin-top:18px">Confirm box</span></div></div><div class="ph"><div class="sc"><div class="st"><span>9:41</span><span>● ● ●</span></div><p class="k">Done</p><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px"><span style="width:110px;height:110px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on);font-size:52px;">✓</span><h1 class="disp" style="font-size:38px">All set!</h1><p style="color:var(--muted);max-width:240px">We’ll send an M-Pesa confirmation in a moment.</p></div><span class="btn ghost" style="width:100%;padding:15px">Back home</span></div></div>
</body></html>
