<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:1080px;background:#0b0f14;color:#fff;font:500 17px/1.4 Barlow,sans-serif;overflow:hidden;position:relative}
.slash{position:absolute;right:-420px;top:-100px;width:820px;height:1400px;background:#d4ff00;transform:rotate(18deg)}
.slash2{position:absolute;right:-30px;top:-100px;width:60px;height:1400px;background:#ff3b30;transform:rotate(18deg)}
nav{position:relative;display:flex;align-items:center;gap:30px;padding:26px 64px;font:800 18px "Barlow Condensed";text-transform:uppercase;letter-spacing:.04em}
nav b{font:900 italic 32px "Barlow Condensed";margin-right:auto}
nav span.c{background:#ff3b30;padding:10px 20px;transform:skewX(-12deg)}
h1{position:relative;font:900 italic 168px/.84 "Barlow Condensed";text-transform:uppercase;padding:40px 64px 0;letter-spacing:-.01em}
h1 span{color:#d4ff00}
.sub{position:relative;padding:22px 64px 0;width:600px;font-size:21px;color:#c8d0da}
.btns{position:relative;display:flex;gap:16px;padding:32px 64px 0}.btns span{font:800 22px "Barlow Condensed";text-transform:uppercase;padding:16px 30px;transform:skewX(-12deg)}
.b1{background:#d4ff00;color:#0b0f14}.b2{border:3px solid #fff}
.runner{position:absolute;right:40px;top:200px;width:480px;height:600px}
.stats{position:absolute;left:64px;bottom:60px;display:flex;gap:0}
.stats div{padding:16px 34px;border-left:4px solid #d4ff00;background:rgba(255,255,255,.06)}
.stats b{display:block;font:900 italic 64px/1 "Barlow Condensed"}.stats small{font:700 13px Barlow;text-transform:uppercase;letter-spacing:.1em;color:#9aa6b4}
.count{position:absolute;right:64px;bottom:60px;color:#0b0f14;font:800 22px "Barlow Condensed";text-transform:uppercase;text-align:right}
.count b{display:block;font:900 italic 88px/1 "Barlow Condensed"}
</style></head><body>
<div class="slash"></div><div class="slash2"></div>
<nav><b>NCM ’27</b><span>Races</span><span>Route</span><span>Results</span><span class="c">Register</span></nav>
<h1>Nairobi<br>City <span>Marathon</span></h1>
<p class="sub">42K, 21K and a 10K fun run through the heart of the city. Sunday 24 October 2027.</p>
<div class="btns"><span class="b1">Enter now — KES 2,500</span><span class="b2">View the route</span></div>
<svg class="runner" viewBox="0 0 520 640"><g fill="#0b0f14"><circle cx="300" cy="90" r="46"/><path d="M270 150 L340 160 L370 300 L300 310z"/><path d="M340 170 L440 240 L425 262 L330 210z"/><path d="M280 170 L190 250 L210 270 L300 205z"/><path d="M300 300 L230 430 L120 480 L135 505 L260 455 L340 330z"/><path d="M360 300 L420 440 L380 590 L410 596 L460 440 L400 300z"/></g></svg>
<div class="stats"><div><b>20,000</b><small>Runners</small></div><div><b>42.2</b><small>Kilometres</small></div><div><b>KES 4M</b><small>Prize money</small></div></div>
<div class="count">Race day in<b>194 days</b></div>
</body></html>
