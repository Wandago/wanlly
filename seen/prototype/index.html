<title>Wanlly Seen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: white page broken into full-width pastel bands; centred chunky headlines; big rounded white cards with thick coloured arcs; black pill buttons, one yellow pill for the main sign-up. */
:root {
  --bg: #FFFFFF;
  --ink: #0A0A0A;
  --muted: #6D6D6D;
  --line: #E7E7E7;
  --soft: #F6F6F6;
  --card: #FFFFFF;
  --yellow: #FFCB00;
  --on-yellow: #0A0A0A;
  --cream: #FEF3D6;
  --mint: #E2F8E5;   --teal: #1E6A5E;
  --lav: #E6DFF5;    --plum: #5B3D8A;
  --peach: #FDE6C8;  --mustard: #D4911C;
  --rose: #FCE5F3;   --maroon: #7A2E22;
  --good: #1F7A4D; --good-soft: #E1F4E9;
  --flag: #AD6200; --flag-soft: #FFEFC9;
  --display: "Gabarito", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0F; --ink: #F4F4F2; --muted: #A3A3A3; --line: #2A2A2C; --soft: #19191B; --card: #161618;
  --cream: #2A2412; --mint: #12271C; --teal: #7AD9C1; --lav: #221C33; --plum: #C9B0F2;
  --peach: #2E2216; --mustard: #F0B54A; --rose: #2E1726; --maroon: #F09A86;
  --good: #6FD3A0; --good-soft: #163325; --flag: #F2B451; --flag-soft: #3A2C12;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E0E0F; --ink: #F4F4F2; --muted: #A3A3A3; --line: #2A2A2C; --soft: #19191B; --card: #161618;
  --cream: #2A2412; --mint: #12271C; --teal: #7AD9C1; --lav: #221C33; --plum: #C9B0F2;
  --peach: #2E2216; --mustard: #F0B54A; --rose: #2E1726; --maroon: #F09A86;
  --good: #6FD3A0; --good-soft: #163325; --flag: #F2B451; --flag-soft: #3A2C12;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--body) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.015em; line-height: 1.04 }
h1 { font-size: clamp(2.4rem, 6.4vw, 5rem); font-weight: 900 }
h2 { font-size: clamp(1.9rem, 4vw, 3.1rem); font-weight: 800 }
h3 { font-size: 1.2rem; font-weight: 700; line-height: 1.2 }
p { margin: 0 }
a { color: inherit }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
.muted { color: var(--muted) }
.small { font-size: 13.5px }
.eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--muted) }
.num { font-variant-numeric: tabular-nums }
.center { text-align: center; justify-items: center }
.lead { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--muted); max-width: 54ch }

/* nav */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg) }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 14px; flex-wrap: wrap }
.logo { display: flex; align-items: center; gap: 4px; font-family: var(--display); font-weight: 900; font-size: 1.55rem; letter-spacing: -0.02em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer }
.logo svg { width: 24px; height: 24px }
.nav { display: flex; gap: 2px; margin-inline: auto; flex-wrap: wrap }
.nav button { background: none; border: 0; padding: 6px 12px; cursor: pointer; font-size: 16px; border-radius: 999px; white-space: nowrap }
.nav button[aria-current="page"] { background: var(--soft); font-weight: 600 }
.auth { display: flex; gap: 10px; align-items: center }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 22px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: var(--ink); color: var(--bg); font-size: 15.5px; white-space: nowrap }
.btn.sm { padding: 7px 16px; font-size: 14px }
.btn.yellow { background: var(--yellow); color: var(--on-yellow); font-size: 17px; padding: 10px 24px }
.btn.line { background: transparent; color: var(--ink); border-color: var(--line) }
.btn.ghost { background: none; color: var(--muted) }
.btn.teal { background: var(--teal); color: var(--bg) }
.btn.plum { background: var(--plum); color: var(--bg) }
.btn.maroon { background: var(--maroon); color: var(--bg) }
.btn.mustard { background: var(--mustard); color: var(--bg) }
.btn:hover { filter: brightness(1.08) }
.announce { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; color: var(--muted); background: var(--bg) }
.announce b { white-space: nowrap; color: var(--ink); font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted) }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.flag { background: var(--flag-soft); color: var(--flag) }
.pill.mint { background: var(--mint); color: var(--teal) }
.pill.lav { background: var(--lav); color: var(--plum) }

/* bands */
main { display: block }
.band { padding-block: clamp(56px, 8vw, 104px) }
.band.cream { background: linear-gradient(180deg, var(--bg), var(--cream) 40%) }
.band.mint { background: linear-gradient(180deg, var(--mint), var(--bg)) }
.band.lav { background: linear-gradient(180deg, var(--lav), var(--bg)) }
.band.peach { background: linear-gradient(180deg, var(--bg), var(--peach)) }
.band.plain { padding-block: 32px 72px }
.stack { display: grid; gap: 16px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.t-teal { color: var(--teal) } .t-plum { color: var(--plum) } .t-mustard { color: var(--mustard) } .t-maroon { color: var(--maroon) }

/* hero */
.hero { display: grid; gap: 22px; justify-items: center; text-align: center; padding-block: 40px 0 }
.search { display: grid; grid-template-columns: 1fr 190px auto; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px; width: min(720px, 100%); box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35) }
.search input, .search select { border: 0; background: transparent; padding: 10px 16px; min-width: 0 }
.search select { border-left: 1px solid var(--line) }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px }
.chip:hover { border-color: var(--ink) }

.frame { position: relative; margin-top: 44px; border: 3px solid var(--mustard); border-radius: 28px; background: var(--card); padding: 20px; box-shadow: 0 30px 60px -40px rgb(0 0 0 / .4) }
.frame .bar { display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; font-size: 13px }
.petal { position: absolute; width: 150px; height: 150px; right: -40px; bottom: -60px; pointer-events: none }
.faces { display: flex; justify-content: center }
.faces span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--on-yellow) }

/* portfolio tiles: CSS stand-ins for photos of work */
.tile { aspect-ratio: 4/3; max-width: 100%; border-radius: 14px; position: relative; overflow: hidden; background: var(--c1, #F2A65A) }
.tile::before { content: ""; position: absolute; width: 85%; aspect-ratio: 1; border-radius: 50%; left: -20%; bottom: -45%; background: var(--c2, #7A2E22) }
.tile::after { content: ""; position: absolute; width: 42%; aspect-ratio: 1; right: 12%; top: 14%; border-radius: 50%; background: var(--c3, #FFCB00) }
.tile[data-s="1"]::after { border-radius: 10px; transform: rotate(14deg) }
.tile[data-s="2"]::before { border-radius: 18px; width: 64%; aspect-ratio: 1.4; left: 18%; bottom: 8% }
.tile[data-s="3"]::after { width: 78%; aspect-ratio: 5; left: 11%; top: 18%; border-radius: 99px }
.tile .who { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); z-index: 1; display: flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 600; color: #FFFFFF; background: rgb(0 0 0 / .45); border-radius: 999px; padding: 3px 9px 3px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile .who i { width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; opacity: .9; flex: none }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 10px; gap: 0 }
.card .body { padding: 12px 6px 4px; display: grid; gap: 5px; min-width: 0 }
.card .name { font-family: var(--display); font-weight: 700; font-size: 17px }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13.5px; color: var(--muted) }
.card:hover { border-color: var(--ink) }
.unclaimed-card .tile { background: repeating-linear-gradient(135deg, var(--soft) 0 10px, var(--card) 10px 20px) }
.unclaimed-card .tile::before, .unclaimed-card .tile::after { display: none }

/* feature cards with thick arcs */
.feature { position: relative; overflow: hidden; background: var(--card); border-radius: 30px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: clamp(24px, 4vw, 48px); border: 1px solid var(--line) }
.feature + .feature { margin-top: 22px }
.feature.flip { grid-template-columns: 1fr 1.1fr }
.feature.flip .copy { order: 2 }
.feature .copy { display: grid; gap: 14px; position: relative; z-index: 1; min-width: 0 }
.feature .copy h2 { font-size: clamp(1.7rem, 3.4vw, 2.6rem) }
.feature .art { position: relative; z-index: 1; min-width: 0 }
.feature::before { content: ""; position: absolute; width: 520px; aspect-ratio: 1; border-radius: 50%; border: 56px solid var(--arc); right: -200px; top: -220px; opacity: .95 }
.feature.flip::before { right: auto; left: -220px; top: auto; bottom: -260px }
.feature.teal { --arc: var(--teal) } .feature.plum { --arc: var(--plum) } .feature.mustard { --arc: var(--mustard) }
.mini { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 20px 40px -30px rgb(0 0 0 / .45) }
.mini .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }

.quote { background: var(--teal); color: var(--bg); border-radius: 30px; padding: clamp(28px, 5vw, 56px); text-align: center; font-family: var(--display); font-size: clamp(1.25rem, 2.4vw, 1.8rem); font-weight: 500; line-height: 1.35; max-width: 980px; margin: 0 auto }
.quote small { display: block; margin-top: 16px; font-family: var(--body); font-size: 15px; opacity: .8 }

/* faq */
.faq { display: grid; gap: 10px; width: min(760px, 100%); margin: 0 auto }
.faq details { border: 1px solid var(--ink); border-radius: 14px; padding: 14px 18px; background: var(--card) }
.faq summary { cursor: pointer; font-weight: 500; font-size: 16.5px; list-style: none; display: flex; gap: 12px }
.faq summary::before { content: "+"; font-weight: 400 }
.faq details[open] summary::before { content: "×" }
.faq details p { margin-top: 8px; color: var(--muted) }

/* footer */
footer { background: #000000; color: #FFFFFF; padding-block: 56px 0 }
footer .cols { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 28px }
footer h4 { margin: 0 0 12px; font-size: 15px }
footer .links { display: grid; gap: 8px; font-size: 14.5px; color: #CFCFCF }
footer .links button { background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; font-size: inherit }
.yband { background: var(--yellow); color: var(--on-yellow); border-radius: 26px 26px 0 0; margin-top: 48px; padding: 28px clamp(20px, 4vw, 48px); font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 11vw, 9rem); line-height: .9; letter-spacing: -0.03em; text-transform: uppercase; overflow: hidden }

/* inner screens */
.pagehead { display: grid; gap: 12px; padding-block: 24px 28px }
.results { display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: start }
.filters { display: grid; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px) }
.filters fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 7px }
.filters legend { margin-bottom: 6px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px }
.toolbar { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); margin-bottom: 18px }
.toolbar input { flex: 1; border: 0; padding: 10px 14px; background: transparent; min-width: 0 }
.toolbar select { border: 0; border-left: 1px solid var(--line); padding: 0 12px; background: transparent }

.cover { height: 190px; border-radius: 30px; position: relative; overflow: hidden; background: var(--cream) }
.cover::after { content: ""; position: absolute; width: 460px; aspect-ratio: 1; border-radius: 50%; border: 60px solid var(--arc, var(--mustard)); right: -120px; top: -230px }
.phead { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: end; margin-top: -54px; padding-inline: 20px; position: relative }
.avatar { width: 112px; height: 112px; border-radius: 50%; border: 5px solid var(--bg); background: var(--yellow); color: var(--on-yellow); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 2.3rem }
.pgrid { display: grid; gap: 28px; grid-template-columns: 1fr 320px; align-items: start; margin-top: 28px }
.pgrid > * { min-width: 0 }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px) }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 10px }
.services div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line) }
.services div:last-child { border-bottom: 0 }
.work { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) }
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--cream); border-radius: 22px; padding: 18px 22px }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 14.5px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }

.steps { display: grid; counter-reset: s; max-width: 640px }
.step { display: grid; grid-template-columns: 38px 1fr; gap: 16px; padding-bottom: 26px; position: relative }
.step::before { counter-increment: s; content: counter(s); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--soft); color: var(--muted) }
.step.done::before { content: "✓"; background: var(--teal); color: var(--bg) }
.step.now::before { background: var(--ink); color: var(--bg) }
.step:not(:last-child)::after { content: ""; position: absolute; left: 18px; top: 42px; bottom: 4px; width: 2px; background: var(--line) }
.code { display: flex; gap: 8px; flex-wrap: wrap }
.code input { width: 48px; text-align: center; font-size: 1.3rem; padding: 10px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card) }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }
.stat { border-radius: 22px; padding: 16px 18px; display: grid; gap: 2px }
.stat:nth-child(1) { background: var(--cream) } .stat:nth-child(2) { background: var(--mint) } .stat:nth-child(3) { background: var(--lav) } .stat:nth-child(4) { background: var(--peach) }
.stat .v { font-family: var(--display); font-size: 2rem; font-weight: 800 }
.delta { font-size: 13px; font-weight: 600; color: var(--good) }
.spark { width: 100%; height: 130px; display: block }
.todo { display: grid; gap: 8px }
.todo label { display: flex; gap: 10px; align-items: center; font-size: 14.5px }
.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--yellow) }
.list > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.list > div:last-child { border-bottom: 0 }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 22px; background: var(--card) }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14.5px }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
tr:last-child td { border-bottom: 0 }
.funnel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px }
.funnel div { border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; background: var(--soft) }
.funnel b { font-family: var(--display); font-size: 1.6rem; font-weight: 800 }
.email { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 10px; max-width: 640px; font-size: 15px }
.email .hdr { font-size: 13.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; display: grid; gap: 2px }

.scrim { position: fixed; inset: 0; background: rgb(10 10 10 / .5); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--card); border-radius: 26px; padding: 26px; width: min(540px, 100%); display: grid; gap: 14px; max-height: 100%; overflow: auto }
.field { display: grid; gap: 6px }
.field label { font-size: 13.5px; font-weight: 600 }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px }
.field textarea { min-height: 90px; resize: vertical }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }

@media (max-width: 900px) {
  .feature, .feature.flip { grid-template-columns: 1fr }
  .feature.flip .copy { order: 0 }
  .results, .pgrid { grid-template-columns: 1fr }
  .filters, .side { position: static }
  .stats { grid-template-columns: repeat(2, 1fr) }
  .funnel { grid-template-columns: repeat(2, 1fr) }
  footer .cols { grid-template-columns: 1fr 1fr }
}
@media (max-width: 640px) {
  .nav { order: 3; width: 100%; margin: 0; overflow-x: auto; flex-wrap: nowrap }
  .auth { margin-left: auto }
  .auth .btn.ghost { display: none }
  .search { grid-template-columns: 1fr; border-radius: 22px }
  .search select { border-left: 0; border-top: 1px solid var(--line) }
  .phead { grid-template-columns: 1fr; padding-inline: 8px }
  .frame { padding: 12px; border-radius: 20px }
  .frame .bar .hide-sm { display: none }
  .frame .grid { grid-template-columns: 1fr 1fr; gap: 10px }
  .frame .card { padding: 6px; border-radius: 16px }
  .frame .card .name { font-size: 14.5px }
  .frame .card .meta { font-size: 12px }
  .frame .tile .who { display: none }
  .announce { font-size: 13px }
  .petal { width: 100px; height: 100px; right: -20px; bottom: -40px }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .2s ease-out }
  @keyframes in { from { transform: translateY(6px) } to { transform: none } }
}
</style>

<header class="top">
  <div class="wrap">
    <button class="logo" data-go="home" aria-label="Wanlly Seen home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="12" cy="12" r="4.2" fill="var(--yellow)"/></svg>Seen</button>
    <nav class="nav" aria-label="Screens">
      <button data-go="home">Home</button>
      <button data-go="results">Find talent</button>
      <button data-go="unclaimed">Unclaimed page</button>
      <button data-go="claim">Claim</button>
      <button data-go="dash">My page</button>
      <button data-go="admin">Admin</button>
    </nav>
    <div class="auth"><button class="btn ghost" data-go="dash">Log in</button><button class="btn yellow" data-go="claim">Get listed</button></div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="cols">

    return `<section class="band plain"><div class="wrap stack">

      <div class="tablewrap"><table><thead><tr><th>Business</th><th>Category</th><th>Town</th><th>Status</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[4] ? `<span class="pill ${r[4]}">${r[3]}</span>` : `<span class="muted">${r[3]}</span>`}</td></tr>`).join("")}</tbody></table></div>
      <h3 style="margin-top:16px">First email</h3>
      <div class="email"><div class="hdr"><span>From: Louis at Wanlly Seen &lt;seen@wanlly.africa&gt;</span><span>To: info@mwangicatering.co.ke</span><span><strong style="color:var(--ink)">Subject: Mwangi & Co. Catering is on Seen</strong></span></div>
        <p>Dear Mwangi & Co. Catering team,</p>

};

const app = document.getElementById("app"), layer = document.getElementById("layer");
function go(v, arg) {
  app.innerHTML = `<div class="view">${v === "profile" ? views.profile(arg) : views[v]()}</div>`;
  document.querySelectorAll(".nav button").forEach((b) => b.dataset.go === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  try { localStorage.setItem("seen-view", v === "profile" ? "home" : v); } catch {}
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
function brief(id) {
  const p = PEOPLE.find((x) => x.id === id);
  layer.innerHTML = `<div class="scrim" data-close><form class="modal" id="briefForm" role="dialog" aria-label="Send a brief">
    <h2 style="font-size:1.8rem">${p ? `Brief for ${esc(first(p.name))}` : "Post a brief"}</h2>
    <p class="small muted">${p ? "They get it by email and WhatsApp and reply to you directly." : "We send it to up to 5 matching people. They reply to you directly."}</p>
    <div class="field"><label for="bWhat">What do you need?</label><textarea id="bWhat">A logo and simple brand colours for my new juice bar in Kilimani.</textarea></div>
    <div class="row" style="align-items:start"><div class="field" style="flex:1;min-width:140px"><label for="bBudget">Budget</label><select id="bBudget"><option>Under KES 5,000</option><option selected>KES 5,000–15,000</option><option>KES 15,000–50,000</option><option>Over KES 50,000</option></select></div>
      <div class="field" style="flex:1;min-width:140px"><label for="bWhen">When</label><select id="bWhen"><option>This week</option><option selected>In 2 weeks</option><option>This month</option><option>Flexible</option></select></div></div>
    <div class="field"><label for="bEmail">Your email or WhatsApp number</label><input type="text" id="bEmail" value="0712 345 678"></div>
    <div class="row"><button class="btn" type="submit">Send brief</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
  </form></div>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-open],[data-brief],[data-toast],[data-copy],[data-close],[data-remove]");
  if (!el) return;
  if (el.hasAttribute("data-close") && e.target !== el && !e.target.matches("button[data-close]")) return;
  if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.open) el.dataset.open === "unclaimed" ? go("unclaimed") : go("profile", el.dataset.open);
  else if (el.hasAttribute("data-brief")) brief(el.dataset.brief);
  else if (el.dataset.toast) toast(el.dataset.toast);
  else if (el.dataset.copy) { const t = el.dataset.copy; try { navigator.clipboard.writeText(t).then(() => toast("Link copied"), () => toast(t)); } catch { toast(t); } }
  else if (el.hasAttribute("data-remove")) toast("In the real app: page deleted and email added to the do-not-list");
  else if (el.hasAttribute("data-close")) layer.innerHTML = "";
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "briefForm") { layer.innerHTML = ""; toast("Brief sent (prototype)"); }
  if (e.target.id === "searchForm") go("results");
});
let start = "home";
try { start = localStorage.getItem("seen-view") || "home"; } catch {}
go(views[start] ? start : "home");
</script>
