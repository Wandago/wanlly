<title>Wanlly Seen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a directory you scan. Sticky top bar, one wide column, portfolio work leads every card. */
:root {
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --ink: #17151F;
  --muted: #6A6577;
  --line: #E6E3EC;
  --accent: #5B34C7;        /* jacaranda */
  --accent-ink: #FFFFFF;
  --accent-soft: #EEE8FB;
  --flag: #B86E00;          /* unclaimed / needs action */
  --flag-soft: #FFF3DC;
  --good: #1F7A4D;
  --good-soft: #E1F4E9;
  --t1: #E9D9FF; --t2: #FFD9C2; --t3: #CFEBDD; --t4: #FFE7A3; --t5: #CFE0FF; --t6: #F6C9D9;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121018; --surface: #1B1824; --ink: #F1EEF7; --muted: #A29CB2; --line: #2E2A3A;
  --accent: #A68BFF; --accent-ink: #120E1E; --accent-soft: #2A2240;
  --flag: #F2B451; --flag-soft: #3A2C12; --good: #6FD3A0; --good-soft: #163325;
  --t1: #3B2E5C; --t2: #5A3727; --t3: #22453A; --t4: #4D4019; --t5: #233A5C; --t6: #4F2636;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121018; --surface: #1B1824; --ink: #F1EEF7; --muted: #A29CB2; --line: #2E2A3A;
  --accent: #A68BFF; --accent-ink: #120E1E; --accent-soft: #2A2240;
  --flag: #F2B451; --flag-soft: #3A2C12; --good: #6FD3A0; --good-soft: #163325;
  --t1: #3B2E5C; --t2: #5A3727; --t3: #22453A; --t4: #4D4019; --t5: #233A5C; --t6: #4F2636;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05; font-weight: 800 }
h2 { font-size: 1.45rem; font-weight: 700 }
h3 { font-size: 1.05rem; font-weight: 700 }
p { margin: 0 }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.small { font-size: 13px }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
.brand { display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 1.25rem; cursor: pointer; background: none; border: 0; padding: 0 }
.brand .eye { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 4px var(--accent-soft); transform: translateY(1px) }
.brand small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted) }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap }
.nav button { background: none; border: 0; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px }
.nav button[aria-current="page"] { color: var(--ink); background: var(--accent-soft) }
.proto { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 6px }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.flag { background: var(--flag); color: var(--surface); border-color: var(--flag) }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.field { display: grid; gap: 6px }
.field label { font-size: 13px; font-weight: 600 }
input[type=text], input[type=email], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px }
textarea { min-height: 90px; resize: vertical }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.flag { background: var(--flag-soft); color: var(--flag) }
.pill.acc { background: var(--accent-soft); color: var(--accent) }

main { padding-block: 28px 64px }
section + section { margin-top: 40px }
.stack { display: grid; gap: 14px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }

/* hero search */
.hero { display: grid; gap: 18px; padding-block: 12px 8px }
.hero p.lead { font-size: 1.1rem; color: var(--muted); max-width: 56ch }
.search { display: grid; grid-template-columns: 1fr 180px auto; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; max-width: 760px }
.search input, .search select { border: 0; background: transparent }
.chips { display: flex; gap: 8px; flex-wrap: wrap }

/* portfolio tiles: stand-ins for real photos of work */
.tile { aspect-ratio: 4/3; max-width: 100%; border-radius: 12px; position: relative; overflow: hidden; background: var(--t1) }
.tile::before, .tile::after { content: ""; position: absolute; border-radius: 50%; opacity: .55 }
.tile::before { width: 70%; height: 90%; left: -15%; bottom: -35%; background: var(--surface) }
.tile::after { width: 38%; height: 50%; right: 10%; top: 12%; background: var(--ink); opacity: .12 }
.tile[data-s="1"]::after { border-radius: 8px; transform: rotate(12deg) }
.tile[data-s="2"]::before { border-radius: 10px; width: 60%; height: 40%; left: 20%; bottom: 10% }
.tile[data-s="3"]::after { width: 80%; height: 14%; left: 10%; top: 20%; border-radius: 4px }
.tile .cap { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 12px; font-weight: 600; color: var(--ink); z-index: 1; text-shadow: 0 1px 0 var(--surface) }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 0 }
.card .body { padding: 12px 14px 14px; display: grid; gap: 4px; min-width: 0 }
.card .name { font-weight: 700; font-size: 15.5px }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted) }
.card:hover { border-color: var(--accent) }
.unclaimed-card .tile { background: repeating-linear-gradient(135deg, var(--line) 0 8px, var(--surface) 8px 16px) }
.unclaimed-card .tile::before, .unclaimed-card .tile::after { display: none }

/* results layout */
.results { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start }
.filters { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px) }
.filters fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px }
.filters legend { margin-bottom: 4px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px }

/* profile */
.cover { height: 150px; border-radius: 16px; background: var(--t1); position: relative; overflow: hidden }
.cover::after { content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%; right: -60px; top: -120px; background: var(--surface); opacity: .35 }
.phead { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: end; margin-top: -42px; padding-inline: 8px; position: relative }
.avatar { width: 92px; height: 92px; border-radius: 22px; border: 4px solid var(--bg); background: var(--t2); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2rem }
.pgrid { display: grid; gap: 28px; grid-template-columns: 1fr 300px; align-items: start; margin-top: 24px }
.pgrid > * { min-width: 0 }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px) }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px }
.services { display: grid; gap: 0 }
.services div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line) }
.services div:last-child { border-bottom: 0 }
.work { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) }
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--flag-soft); color: var(--ink); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--flag) }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.blurred { color: transparent; text-shadow: 0 0 8px var(--muted); user-select: none }

/* steps (claim flow): a real sequence */
.steps { display: grid; gap: 0; counter-reset: s; max-width: 640px }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding-bottom: 22px; position: relative }
.step::before { counter-increment: s; content: counter(s); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--line); color: var(--muted) }
.step.done::before { content: "✓"; background: var(--good); color: var(--surface) }
.step.now::before { background: var(--accent); color: var(--accent-ink) }
.step:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: var(--line) }
.code { display: flex; gap: 8px }
.code input { width: 46px; text-align: center; font-family: var(--mono); font-size: 1.2rem; padding: 10px 0 }

/* dashboard */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 2px }
.stat .v { font-family: var(--mono); font-size: 1.6rem; font-weight: 500 }
.delta { font-size: 12px; font-weight: 600; color: var(--good) }
.spark { width: 100%; height: 120px; display: block }
.todo { display: grid; gap: 8px }
.todo label { display: flex; gap: 10px; align-items: center; font-size: 14px }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent) }
.list { display: grid }
.list > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.list > div:last-child { border-bottom: 0 }

/* admin table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
tr:last-child td { border-bottom: 0 }
.funnel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.funnel div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px }
.email { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; max-width: 620px; font-size: 14.5px }
.email .hdr { font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; display: grid; gap: 2px }

/* modal */
.scrim { position: fixed; inset: 0; background: rgb(10 8 16 / .5); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--surface); border-radius: 18px; padding: 22px; width: min(520px, 100%); display: grid; gap: 14px; max-height: 100%; overflow: auto }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }

@media (max-width: 820px) {
  .results, .pgrid { grid-template-columns: 1fr }
  .filters, .side { position: static }
  .stats { grid-template-columns: repeat(2, 1fr) }
  .funnel { grid-template-columns: repeat(2, 1fr) }
}
@media (max-width: 560px) {
  .search { grid-template-columns: 1fr }
  .phead { grid-template-columns: auto 1fr; }
  .phead .actions { grid-column: 1 / -1 }
  .nav { margin-left: 0; width: 100% }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .18s ease-out }
  @keyframes in { from { transform: translateY(4px) } to { transform: none } }
}
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="Wanlly Seen home"><span class="eye"></span>Seen <small>seen.wanlly.africa</small></button>
    <span class="proto">Prototype · example data</span>
    <nav class="nav" aria-label="Screens">
      <button data-go="home">Find</button>
      <button data-go="results">Browse</button>
      <button data-go="unclaimed">Unclaimed page</button>
      <button data-go="claim">Claim</button>
      <button data-go="dash">My page</button>
      <button data-go="admin">Admin</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
const PEOPLE = [
  { id: "amina", name: "Amina Wanjiru", initials: "AW", kind: "Freelancer", trade: "Brand & logo design", city: "Nairobi", t: 1, claimed: true, updated: "2 days ago", reply: "Replies in about 2 hours", from: 8000,
    work: ["Logo · Mama Mboga app", "Packaging · Kahawa Bora", "Brand book · Tujenge Sacco", "Menu · Java Kilimani", "Poster · Blankets & Wine", "Social kit · Zuri Salon"],
    services: [["Logo + brand basics", 8000], ["Full brand identity", 35000], ["Social media kit", 6000]],
    about: "I design brands for Kenyan small businesses: logos, packaging and the social posts that go with them. Six years, 90+ clients." },
  { id: "otieno", name: "Brian Otieno", initials: "BO", kind: "Freelancer", trade: "Wedding & event photography", city: "Kisumu", t: 2, claimed: true, updated: "5 days ago", reply: "Replies same day", from: 15000,
    work: ["Wedding · Dunga Hill", "Ruracio · Kisumu", "Corporate · KCB AGM"], services: [["Half-day event", 15000], ["Full wedding day", 60000]], about: "Weddings, ruracios and corporate events across western Kenya." },
  { id: "kibet", name: "Kibet Web Studio", initials: "KW", kind: "Business", trade: "Websites & online shops", city: "Eldoret", t: 5, claimed: true, updated: "1 week ago", reply: "Replies in about a day", from: 25000,
    work: ["Shop · Rift Valley Dairy", "Site · Eldoret Hospital", "Booking · Kerio Lodge"], services: [["Business website", 25000], ["Online shop with M-Pesa", 55000]], about: "Small team building fast websites and M-Pesa shops." },
  { id: "njeri", name: "Njeri Kamau", initials: "NK", kind: "Freelancer", trade: "Copywriting & content", city: "Remote · Kenya", t: 4, claimed: true, updated: "today", reply: "Replies in about an hour", from: 3000,
    work: ["Website copy · Lipa Later", "Blog series · Twiga", "Newsletter · Akiba"], services: [["Website page", 3000], ["Monthly blog (4 posts)", 18000]], about: "Clear copy for fintech and consumer brands." },
  { id: "zawadi", name: "Zawadi Tailoring", initials: "ZT", kind: "Business", trade: "Tailoring & bridal", city: "Mombasa", t: 6, claimed: true, updated: "3 days ago", reply: "Replies same day", from: 4500,
    work: ["Bridal · Nyali", "Kitenge suits", "School uniforms"], services: [["Kitenge outfit", 4500], ["Bridal gown", 45000]], about: "Made-to-measure kitenge, suits and bridal wear." },
  { id: "mwangi", name: "Mwangi & Co. Catering", initials: "MC", kind: "Business", trade: "Event catering", city: "Nakuru", t: 3, claimed: false, updated: "", reply: "", from: 0, work: [], services: [], about: "" },
];
const CATS = ["Design", "Photography", "Video", "Websites", "Writing", "Music & DJs", "Events", "Catering", "Tailoring", "Makeup & hair", "Accounting", "Legal"];
const cover = (i) => `--t${((i - 1) % 6) + 1}`;
const fmt = (n) => "KES " + n.toLocaleString("en-KE");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function tile(i, cap, s = i % 4) {
  return `<div class="tile" data-s="${s}" style="background:var(${cover(i)})">${cap ? `<span class="cap">${esc(cap)}</span>` : ""}</div>`;
}
function card(p) {
  if (!p.claimed) return `<button class="card unclaimed-card" data-open="unclaimed"><div class="tile"></div><div class="body"><span class="name">${esc(p.name)}</span><span class="meta">${esc(p.trade)} · ${esc(p.city)}</span><span><span class="pill flag">Unclaimed</span></span></div></button>`;
  return `<button class="card" data-open="${p.id}">${tile(p.t, p.work[0])}<div class="body"><span class="name">${esc(p.name)}</span><span class="meta">${esc(p.trade)} · ${esc(p.city)}</span><span class="meta"><span class="pill ${p.kind === "Business" ? "acc" : "good"}">${p.kind}</span>From <span class="num">${fmt(p.from)}</span></span><span class="meta small">New work ${esc(p.updated)}</span></div></button>`;
}

const views = {
  home() {
    return `<div class="hero">
      <span class="label">Kenyan freelancers and small businesses</span>
      <h1>Find someone good.<br>See their work first.</h1>
      <p class="lead">Every page here is a portfolio. Look at real work, see a starting price, and send a brief in one tap. Free for everyone, on both sides.</p>
      <form class="search" id="searchForm" role="search">
        <input type="text" id="q" aria-label="What do you need?" placeholder="What do you need? e.g. a logo, wedding photos">
        <select id="city" aria-label="Where"><option>Anywhere in Kenya</option><option>Nairobi</option><option>Mombasa</option><option>Kisumu</option><option>Nakuru</option><option>Eldoret</option><option>Remote</option></select>
        <button class="btn primary" type="submit">Search</button>
      </form>
      <div class="chips">${CATS.map((c) => `<button class="chip" data-go="results">${c}</button>`).join("")}</div>
    </div>
    <section class="stack">
      <div class="row between"><h2>New work this week</h2><button class="btn ghost" data-go="results">See all</button></div>
      <div class="grid">${PEOPLE.filter((p) => p.claimed).map(card).join("")}</div>
    </section>
    <section class="box" style="max-width:760px">
      <h3>Not sure who to pick? Post a brief.</h3>
      <p class="muted">Say what you need, where and your budget. We send it to up to 5 matching people, and they reply to you directly.</p>
      <div><button class="btn primary" data-brief="">Post a brief</button></div>
    </section>`;
  },
  results() {
    const f = (legend, items) => `<fieldset><legend class="label">${legend}</legend>${items.map(([id, l, on]) => `<label class="check"><input type="checkbox" id="${id}" ${on ? "checked" : ""}> ${l}</label>`).join("")}</fieldset>`;
    return `<div class="stack" style="margin-bottom:20px"><span class="label">Design · Anywhere in Kenya</span><h2>143 people and businesses</h2></div>
    <div class="results">
      <aside class="filters">
        ${f("Who", [["fF", "Freelancers", 1], ["fB", "Businesses", 1]])}
        ${f("Show", [["fA", "Taking work now", 1], ["fP", "Has a portfolio", 1], ["fU", "Include unclaimed", 0]])}
        ${f("Starting price", [["p1", "Under KES 5,000"], ["p2", "KES 5,000–20,000"], ["p3", "Over KES 20,000"]])}
        <p class="small muted">Sorted by recent work. Pages with new work in the last 30 days come first.</p>
      </aside>
      <div class="grid">${PEOPLE.map(card).join("")}</div>
    </div>`;
  },
  profile(id) {
    const p = PEOPLE.find((x) => x.id === id) || PEOPLE[0];
    return `<div class="cover" style="background:var(${cover(p.t)})"></div>
    <div class="phead">
      <div class="avatar" style="background:var(${cover(p.t + 1)})">${p.initials}</div>
      <div class="stack" style="gap:4px;min-width:0"><h1 style="font-size:clamp(1.6rem,4vw,2.2rem)">${esc(p.name)}</h1><div class="row small muted"><span class="pill ${p.kind === "Business" ? "acc" : "good"}">${p.kind}</span>${esc(p.trade)} · ${esc(p.city)}<span class="pill good">✓ Verified email and phone</span></div></div>
      <div class="row actions"><button class="btn" data-copy="seen.wanlly.africa/${p.id}">Copy link</button><button class="btn primary" data-brief="${p.id}">Start a project</button></div>
    </div>

        <div class="box"><span class="label">Briefs</span><div class="list">
          <div><strong>Logo for a juice bar in Kilimani</strong><span class="pill flag">New</span><span class="small muted">Budget KES 10,000–15,000 · needs it in 2 weeks</span><span class="small muted">1h ago</span></div>
          <div><strong>Rebrand for a SACCO</strong><span class="pill good">You replied</span><span class="small muted">Budget KES 40,000 · Thika</span><span class="small muted">Tue</span></div>
          <div><strong>Instagram templates for a salon</strong><span class="pill acc">Agreement sent</span><span class="small muted">KES 6,000 · signing on Wanlly Sign</span><span class="small muted">Oct 9</span></div>
        </div></div>
      </div>
      <aside class="side">
        <div class="box"><div class="row between"><span class="label">Page strength</span><span class="num">80%</span></div><div class="meter"><i style="width:80%"></i></div>
          <div class="todo"><label><input type="checkbox" checked disabled> 6 pieces of work</label><label><input type="checkbox" checked disabled> Prices for 3 services</label><label><input type="checkbox" checked disabled> WhatsApp number</label><label><input type="checkbox" disabled> Something new in the last 30 days</label></div>

        <div class="box"><span class="label">Monthly email</span><p class="small">On the 1st we email you your views, taps and briefs for the month, so you can see it working.</p></div>

    </div>`;
  },
  admin() {
    const rows = [
      ["Mwangi & Co. Catering", "Catering", "Nakuru", "Emailed · step 1 of 3", "flag"],
      ["Pixel Shades Studio", "Photography", "Nairobi", "Claimed Oct 14", "good"],
      ["Coast Prints Ltd", "Printing", "Mombasa", "Removed by owner", ""],
      ["Lakeside Events", "Events", "Kisumu", "Queued", "acc"],
      ["Grace Mua Beauty", "Makeup & hair", "Nairobi", "Emailed · step 2 of 3", "flag"],
    ];
    return `<div class="stack" style="margin-bottom:20px"><span class="label">Admin · listings and outreach</span><h2>Business list and claim emails</h2><p class="muted" style="max-width:62ch">Import a CSV of businesses. Each one gets an unclaimed page with its public details only, then up to three emails inviting the owner to claim or remove it. Nothing sends until you press Start.</p></div>
    <div class="funnel">

const app = document.getElementById("app"), layer = document.getElementById("layer");
let current = "home";
function go(v, arg) {
  current = v;
  app.innerHTML = `<div class="view">${v === "profile" ? views.profile(arg) : views[v]()}</div>`;
  document.querySelectorAll(".nav button").forEach((b) => b.dataset.go === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  try { localStorage.setItem("seen-view", v === "profile" ? "home" : v); } catch {}
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
function brief(id) {
  const p = PEOPLE.find((x) => x.id === id);
  layer.innerHTML = `<div class="scrim" data-close><form class="modal" id="briefForm" role="dialog" aria-label="Send a brief">
    <h2>${p ? `Brief for ${esc(p.name.split(" ")[0])}` : "Post a brief"}</h2>
    <p class="small muted">${p ? "They get it by email and WhatsApp and reply to you directly." : "We send it to up to 5 matching people. They reply to you directly."}</p>
    <div class="field"><label for="bWhat">What do you need?</label><textarea id="bWhat">A logo and simple brand colours for my new juice bar in Kilimani.</textarea></div>
    <div class="row" style="align-items:start"><div class="field" style="flex:1;min-width:140px"><label for="bBudget">Budget</label><select id="bBudget"><option>Under KES 5,000</option><option selected>KES 5,000–15,000</option><option>KES 15,000–50,000</option><option>Over KES 50,000</option></select></div>
      <div class="field" style="flex:1;min-width:140px"><label for="bWhen">When</label><select id="bWhen"><option>This week</option><option selected>In 2 weeks</option><option>This month</option><option>Flexible</option></select></div></div>
    <div class="field"><label for="bEmail">Your email or WhatsApp number</label><input type="text" id="bEmail" value="0712 345 678"></div>
    <div class="row"><button class="btn primary" type="submit">Send brief</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
  </form></div>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-open],[data-brief],[data-toast],[data-copy],[data-close],[data-remove]");
  if (!el) return;
  if (el.hasAttribute("data-close") && e.target !== el && !e.target.matches("button[data-close]")) return;
  if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.open) el.dataset.open === "unclaimed" ? go("unclaimed") : go("profile", el.dataset.open);
  else if (el.hasAttribute("data-brief")) brief(el.dataset.brief);
  else if (el.dataset.toast) toast(el.dataset.toast);
  else if (el.dataset.copy) navigator.clipboard?.writeText(el.dataset.copy).then(() => toast("Link copied"), () => toast(el.dataset.copy));
  else if (el.hasAttribute("data-remove")) toast("In the real app: page deleted and email added to the do-not-list");
  else if (el.hasAttribute("data-close")) layer.innerHTML = "";
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "briefForm") { layer.innerHTML = ""; toast("Brief sent (prototype)"); }
  if (e.target.id === "searchForm") go("results");
});
let start = "home";
try { start = localStorage.getItem("seen-view") || "home"; } catch {}
go(views[start] ? start : "home");
</script>
